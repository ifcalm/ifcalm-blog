<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="430" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">渔民越多，湖里的鱼越少，大家的总利润越薄</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">N 个一模一样的渔民，各自选自己的捕捞力度（同一个模型，数字是编的）。柱子：全湖总利润；下面是稳态的鱼量</text>
  <line x1="70" y1="290" x2="700" y2="290" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="90" y="118.5" width="56" height="171.5" fill="#d9480f" opacity="0.88"/>
  <text x="118" y="112.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">61.25</text>
  <text x="118" y="310" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">N = 1</text>
  <text x="118" y="330" font-size="12" fill="#52606d" text-anchor="middle">鱼 65</text>
  <rect x="178" y="137.6" width="56" height="152.4" fill="#d9480f" opacity="0.88"/>
  <text x="206" y="131.6" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">54.44</text>
  <text x="206" y="310" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">N = 2</text>
  <text x="206" y="330" font-size="12" fill="#52606d" text-anchor="middle">鱼 53.3</text>
  <rect x="266" y="161.4" width="56" height="128.6" fill="#d9480f" opacity="0.88"/>
  <text x="294" y="155.4" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">45.94</text>
  <text x="294" y="310" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">N = 3</text>
  <text x="294" y="330" font-size="12" fill="#52606d" text-anchor="middle">鱼 47.5</text>
  <rect x="354" y="194.7" width="56" height="95.3" fill="#d9480f" opacity="0.88"/>
  <text x="382" y="188.7" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">34.03</text>
  <text x="382" y="310" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">N = 5</text>
  <text x="382" y="330" font-size="12" fill="#52606d" text-anchor="middle">鱼 41.7</text>
  <rect x="442" y="233.3" width="56" height="56.7" fill="#d9480f" opacity="0.88"/>
  <text x="470" y="227.3" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">20.25</text>
  <text x="470" y="310" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">N = 10</text>
  <text x="470" y="330" font-size="12" fill="#52606d" text-anchor="middle">鱼 36.4</text>
  <rect x="530" y="258.9" width="56" height="31.1" fill="#d9480f" opacity="0.88"/>
  <text x="558" y="252.9" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">11.11</text>
  <text x="558" y="310" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">N = 20</text>
  <text x="558" y="330" font-size="12" fill="#52606d" text-anchor="middle">鱼 33.3</text>
  <rect x="618" y="290.0" width="56" height="1.5" fill="#d9480f" opacity="0.88"/>
  <text x="646" y="284.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">0</text>
  <text x="646" y="310" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">很多</text>
  <text x="646" y="330" font-size="12" fill="#52606d" text-anchor="middle">鱼 30</text>
  <text x="24" y="368" font-size="13" fill="#1f2933">只有 1 个渔民时，这位渔民替整个湖想，利润最大（61.25）；</text>
  <text x="24" y="388" font-size="13" fill="#1f2933">人数越多，每个人只管自己，总利润一路下滑，趋近 0，鱼量趋近 30。</text>
  <text x="24" y="410" font-size="12" fill="#7b8794">这和"几家公司各自决定产量"是同一个结构：每家只算自己多产一点的好处，不算它压低了所有人的价格。</text>
</svg>
