<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="470" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">出价越高，两个人都在亏：可是"再加 5"总是显得更划算</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">奖品 100，最高的两个人都要付自己的出价。横轴：当前最高出价 h，第二高是 h − 5。纵轴：各种结果下的收益</text>
  <rect x="380.0" y="110.0" width="290.0" height="230.0" fill="#fff4e6"/>
  <line x1="90" y1="186.66666666666666" x2="670" y2="186.66666666666666" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="380.0" y1="110.0" x2="380.0" y2="340.0" stroke="#d9480f" stroke-dasharray="5 4"/>
  <text x="388.0" y="124.0" font-size="12" fill="#d9480f" font-weight="600">出价超过奖品价值：赢了也亏</text>
  <polyline points="90.0,110.0 670.0,263.3333333333333" fill="none" stroke="#2b8a3e" stroke-width="3"/>
  <polyline points="104.5,186.66666666666666 670.0,336.1666666666667" fill="none" stroke="#d9480f" stroke-width="3"/>
  <polyline points="90.0,113.83333333333334 655.5,263.3333333333333" fill="none" stroke="#4c6ef5" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="82" y="344.0" font-size="12" fill="#52606d" text-anchor="end">-200</text>
  <text x="82" y="267.3333333333333" font-size="12" fill="#52606d" text-anchor="end">-100</text>
  <text x="82" y="190.66666666666666" font-size="12" fill="#52606d" text-anchor="end">0</text>
  <text x="82" y="114.0" font-size="12" fill="#52606d" text-anchor="end">100</text>
  <text x="90.0" y="358.0" font-size="12" fill="#52606d" text-anchor="middle">0</text>
  <text x="235.0" y="358.0" font-size="12" fill="#52606d" text-anchor="middle">50</text>
  <text x="380.0" y="358.0" font-size="12" fill="#52606d" text-anchor="middle">100</text>
  <text x="525.0" y="358.0" font-size="12" fill="#52606d" text-anchor="middle">150</text>
  <text x="670.0" y="358.0" font-size="12" fill="#52606d" text-anchor="middle">200</text>
  <text x="380.0" y="378.0" font-size="12" fill="#52606d" text-anchor="middle">当前最高出价 h</text>
  <line x1="98.7" y1="278.7" x2="130.6" y2="278.7" stroke="#2b8a3e" stroke-width="3" /><text x="136.4" y="282.7" font-size="12" fill="#1f2933">领先者：现在停手，得 100 − h</text>
  <line x1="98.7" y1="301.7" x2="130.6" y2="301.7" stroke="#d9480f" stroke-width="3" /><text x="136.4" y="305.7" font-size="12" fill="#1f2933">第二名：现在停手，得 −(h − 5)</text>
  <line x1="98.7" y1="324.7" x2="130.6" y2="324.7" stroke="#4c6ef5" stroke-width="3" stroke-dasharray="7 5"/><text x="136.4" y="328.7" font-size="12" fill="#1f2933">第二名：加价 5 后对方放弃，得 100 − (h + 5)</text>
  <text x="24" y="438" font-size="13" fill="#1f2933">第二名"加价 5"比"停手"好，只需要相信对方有 10% 的可能放弃。这个门槛，对任何 h 都一样。</text>
  <text x="24" y="458" font-size="12" fill="#7b8794">这里只看一步，没有算对方再加价的后果。</text>
</svg>
