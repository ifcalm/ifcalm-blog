<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="376" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">"一定有终点，可是要走多久"：均衡的难处</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">一条被折叠进巨大迷宫的单行道：入口已知，每个路口只有一进一出，所以另一头一定存在</text>
  <polyline points="60,120 100,120 140,120 180,120 220,120 260,120 300,120 340,120 380,120 420,120 460,120 500,120 540,120 580,120 620,120 620,158 580,158 540,158 500,158 460,158 420,158 380,158 340,158 300,158 260,158 220,158 180,158 140,158 100,158 60,158 60,196 100,196 140,196 180,196 220,196 260,196 300,196 340,196 380,196 420,196 460,196 500,196 540,196 580,196 620,196 620,234 580,234 540,234 500,234 460,234 420,234 380,234 340,234 300,234 260,234 220,234 180,234 140,234 100,234 60,234 60,272 100,272 140,272 180,272 220,272 260,272 300,272 340,272 380,272 420,272 460,272 500,272 540,272 580,272 620,272" fill="none" stroke="#4c6ef5" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="60" cy="120" r="8" fill="#2b8a3e"/><text x="58" y="106" font-size="12" fill="#2b8a3e" font-weight="600">入口（已知）</text>
  <circle cx="620" cy="272" r="8" fill="#d9480f"/><text x="636" y="300" font-size="12" fill="#d9480f" font-weight="600" text-anchor="end">另一头（一定存在，在哪里不知道）</text>
  <text x="24" y="334" font-size="13" fill="#1f2933">从入口一步一步往前走，一定能走到另一头；可是路可以长到 2ⁿ 步（n 是博弈的大小）。</text>
  <text x="24" y="356" font-size="12" fill="#7b8794">"沿路径走"的经典算法就是这个样子；专门的复杂度类别 PPAD，就是这一类"答案一定存在，却可能要走很久"的问题。</text>
</svg>
