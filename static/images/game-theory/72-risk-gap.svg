<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="360" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">简单模型说"几乎不会打"，当事人和后来的研究者说"差点就打了"</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">横轴取对数：每格是 10 倍。条越长，战争的概率越大。各来源口径不完全一致，这里只作数量级的对照</text>
  <line x1="70.0" y1="80" x2="70.0" y2="262" stroke="#e4e7eb"/><text x="70.0" y="280" font-size="12" fill="#52606d" text-anchor="middle">0.001%</text>
  <line x1="194.0" y1="80" x2="194.0" y2="262" stroke="#e4e7eb"/><text x="194.0" y="280" font-size="12" fill="#52606d" text-anchor="middle">0.01%</text>
  <line x1="318.0" y1="80" x2="318.0" y2="262" stroke="#e4e7eb"/><text x="318.0" y="280" font-size="12" fill="#52606d" text-anchor="middle">0.1%</text>
  <line x1="442.0" y1="80" x2="442.0" y2="262" stroke="#e4e7eb"/><text x="442.0" y="280" font-size="12" fill="#52606d" text-anchor="middle">1%</text>
  <line x1="566.0" y1="80" x2="566.0" y2="262" stroke="#e4e7eb"/><text x="566.0" y="280" font-size="12" fill="#52606d" text-anchor="middle">10%</text>
  <line x1="690.0" y1="80" x2="690.0" y2="262" stroke="#e4e7eb"/><text x="690.0" y="280" font-size="12" fill="#52606d" text-anchor="middle">100%</text>
  <rect x="70" y="90" width="372.0" height="22" fill="#9aa5b1" opacity="0.9"/><text x="76" y="106" font-size="12" fill="#ffffff" font-weight="600">斗鸡模型的混合均衡（战争的代价 −10）：1%</text>
  <rect x="70" y="124" width="124.0" height="22" fill="#9aa5b1" opacity="0.9"/><text x="202.0" y="140" font-size="12" fill="#1f2933" font-weight="600">同一模型（战争的代价 −100）：0.01%</text>
  <rect x="70" y="158" width="560.8" height="22" fill="#d9480f" opacity="0.9"/><text x="76" y="174" font-size="12" fill="#ffffff" font-weight="600">总统事后的估计的下端：约 1/3（二手转述）</text>
  <rect x="70" y="192" width="582.7" height="22" fill="#d9480f" opacity="0.9"/><text x="76" y="208" font-size="12" fill="#ffffff" font-weight="600">总统事后的估计的上端：约 1/2</text>
  <rect x="70" y="226" width="592.5" height="22" fill="#4c6ef5" opacity="0.9"/><text x="76" y="242" font-size="12" fill="#ffffff" font-weight="600">Dixit 等人的估计：约 60%（摘要）</text>
  <text x="24" y="320" font-size="13" fill="#1f2933">模型漏掉了什么？局势会失控、双方的信息不全、还有"互换"这第三个选项。</text>
</svg>
