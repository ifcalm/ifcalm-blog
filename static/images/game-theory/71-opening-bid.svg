<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="450" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">预算都是 250 的两个"完美推理者"：关键是一开口就跳到 60</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">奖品 100，每次加价至少 5，两人预算都是 250 且互相知道。纵轴：先出价的人，在对方也完美推理时的最终收益</text>
  <line x1="90" y1="147.61904761904762" x2="670" y2="147.61904761904762" stroke="#9aa5b1" stroke-width="1.5"/>
  <polyline points="101.6,152.4 113.2,157.1 124.8,161.9 136.4,166.7 148.0,171.4 159.6,176.2 171.2,181.0 182.8,185.7 194.4,190.5 206.0,195.2 217.6,200.0 229.2,109.5 240.8,114.3 252.4,119.0 264.0,123.8 275.6,128.6 287.2,133.3 298.8,138.1 310.4,142.9 322.0,147.6 333.6,152.4 345.2,157.1 356.8,161.9 368.4,166.7 380.0,171.4 391.6,176.2 403.2,181.0 414.8,185.7 426.4,190.5 438.0,195.2 449.6,200.0 461.2,204.8 472.8,209.5 484.4,214.3 496.0,219.0 507.6,223.8 519.2,228.6 530.8,233.3 542.4,238.1 554.0,242.9 565.6,247.6 577.2,252.4 588.8,257.1 600.4,261.9 612.0,266.7 623.6,271.4 635.2,276.2 646.8,281.0 658.4,285.7 670.0,290.5" fill="none" stroke="#d9480f" stroke-width="3"/>
  <circle cx="229.2" cy="109.5" r="6" fill="#1f2933"/><text x="239.2" y="105.5" font-size="12" fill="#1f2933" font-weight="600">开价 60：收益 40，对方放弃</text>
  <text x="113.2" y="234.0" font-size="12" fill="#d9480f" font-weight="600">开价低于 60：对方立刻跳到 60，你放弃，白付开价</text>
  <text x="90.0" y="318.0" font-size="12" fill="#52606d" text-anchor="middle">0</text>
  <text x="206.0" y="318.0" font-size="12" fill="#52606d" text-anchor="middle">50</text>
  <text x="322.0" y="318.0" font-size="12" fill="#52606d" text-anchor="middle">100</text>
  <text x="438.0" y="318.0" font-size="12" fill="#52606d" text-anchor="middle">150</text>
  <text x="554.0" y="318.0" font-size="12" fill="#52606d" text-anchor="middle">200</text>
  <text x="670.0" y="318.0" font-size="12" fill="#52606d" text-anchor="middle">250</text>
  <text x="82" y="294.5" font-size="12" fill="#52606d" text-anchor="end">-150</text>
  <text x="82" y="246.9" font-size="12" fill="#52606d" text-anchor="end">-100</text>
  <text x="82" y="199.2" font-size="12" fill="#52606d" text-anchor="end">-50</text>
  <text x="82" y="151.6" font-size="12" fill="#52606d" text-anchor="end">0</text>
  <text x="82" y="104.0" font-size="12" fill="#52606d" text-anchor="end">50</text>
  <text x="380" y="338.0" font-size="12" fill="#52606d" text-anchor="middle">先出价的人的开价</text>
  <text x="24" y="398" font-size="13" fill="#1f2933">在这个设定里，理论上不会出现升级：拍卖者只收到 60，不到奖品的价值 100。</text>
  <text x="24" y="420" font-size="12" fill="#7b8794">这是我按这个设定逐步倒推出来的；O&apos;Neill 1986 年的论文报告的也是开价 60（据摘要的二手转述）。</text>
</svg>
