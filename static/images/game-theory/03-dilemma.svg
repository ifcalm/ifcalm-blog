  <text x="390.0" y="404.0" font-size="13" fill="#1f2933" text-anchor="middle">你的日利润（千元）</text>
  <text x="24" y="54.0" font-size="12" fill="#7b8794">小周的日利润（千元）</text>
  <line x1="459.0" y1="178.5" x2="325.0" y2="239.5" stroke="#d9480f" stroke-width="3" marker-end="url(#ar)"/>
  <text x="404.0" y="240.0" font-size="13" fill="#d9480f" font-weight="600">两人各自降价</text>
