<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="400" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">红绿灯：三种信号各占 1/3，每人只看到自己的那一半</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">让 = 让行；抢 = 抢行。灯每次随机抽一种，分别告诉你和小周各自该做什么</text>
  <rect x="40" y="90" width="220" height="190" rx="10" fill="#fafbfc" stroke="#e4e7eb"/>
  <text x="150" y="116" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">信号 A (1/3)</text>
  <text x="60" y="158" font-size="13" fill="#52606d">你被告知</text><rect x="170" y="134" width="70" height="34" rx="6" fill="#2f9e44"/><text x="205" y="157" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">让</text>
  <text x="60" y="210" font-size="13" fill="#52606d">小周被告知</text><rect x="170" y="186" width="70" height="34" rx="6" fill="#2f9e44"/><text x="205" y="209" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">让</text>
  <text x="150" y="262" font-size="14" fill="#1f2933" text-anchor="middle">收益（你，小周）：6，6</text>
  <rect x="280" y="90" width="220" height="190" rx="10" fill="#fafbfc" stroke="#e4e7eb"/>
  <text x="390" y="116" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">信号 B (1/3)</text>
  <text x="300" y="158" font-size="13" fill="#52606d">你被告知</text><rect x="410" y="134" width="70" height="34" rx="6" fill="#2f9e44"/><text x="445" y="157" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">让</text>
  <text x="300" y="210" font-size="13" fill="#52606d">小周被告知</text><rect x="410" y="186" width="70" height="34" rx="6" fill="#d9480f"/><text x="445" y="209" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">抢</text>
  <text x="390" y="262" font-size="14" fill="#1f2933" text-anchor="middle">收益（你，小周）：2，7</text>
  <rect x="520" y="90" width="220" height="190" rx="10" fill="#fafbfc" stroke="#e4e7eb"/>
  <text x="630" y="116" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">信号 C (1/3)</text>
  <text x="540" y="158" font-size="13" fill="#52606d">你被告知</text><rect x="650" y="134" width="70" height="34" rx="6" fill="#d9480f"/><text x="685" y="157" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">抢</text>
  <text x="540" y="210" font-size="13" fill="#52606d">小周被告知</text><rect x="650" y="186" width="70" height="34" rx="6" fill="#2f9e44"/><text x="685" y="209" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">让</text>
  <text x="630" y="262" font-size="14" fill="#1f2933" text-anchor="middle">收益（你，小周）：7，2</text>
  <text x="24" y="316" font-size="13" fill="#1f2933">你被告知"让"时：对方是"让"还是"抢"，各一半可能。照做平均得 4；改成抢，平均得 3.5。</text>
  <text x="24" y="338" font-size="13" fill="#1f2933">你被告知"抢"时：对方一定是"让"。照做得 7；改成让，得 6。所以每个人都愿意听灯的。</text>
  <text x="24" y="368" font-size="12" fill="#7b8794">灯从不让两个人同时抢，所以没有撞车。平均每人得 (6 + 2 + 7) ÷ 3 = 5。</text>
</svg>
