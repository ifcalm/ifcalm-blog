<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="450" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">四人公共池：不管别人怎么做，"不投"永远比"投"多 6</text>
  <g stroke="#e4e7eb" stroke-width="1">
    <line x1="100" y1="360.0" x2="669" y2="360.0"/>
    <line x1="100" y1="285.0" x2="669" y2="285.0"/>
    <line x1="100" y1="210.0" x2="669" y2="210.0"/>
    <line x1="100" y1="135.0" x2="669" y2="135.0"/>
    <line x1="100" y1="60.0" x2="669" y2="60.0"/>
  </g>
  <line x1="100" y1="360.0" x2="669" y2="360.0" stroke="#9aa5b1" stroke-width="1.5"/>
  <g font-size="12" fill="#52606d" text-anchor="end">
    <text x="92" y="364.0">0</text>
    <text x="92" y="289.0">6</text>
    <text x="92" y="214.0">12</text>
    <text x="92" y="139.0">18</text>
    <text x="92" y="64.0">24</text>
  </g>
  <g font-size="13" fill="#52606d" text-anchor="middle">
