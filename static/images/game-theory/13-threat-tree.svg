<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="470" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">"再哭就不带你出来了"：这句威胁可信吗？</text>
  <text x="20" y="76" font-size="14" font-weight="600" fill="#1f2933">原来：让步得 1，惩罚得 0</text>
  <rect x="218" y="206" width="146" height="196" rx="10" fill="#f4fbf6" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="291" y="390" font-size="12" fill="#2b8a3e" font-weight="600" text-anchor="middle">这一块是一个子博弈</text>
  <line x1="190" y1="144" x2="80" y2="280" stroke="#52606d" stroke-width="2"/>
  <line x1="190" y1="144" x2="290" y2="226" stroke="#d9480f" stroke-width="4"/>
  <line x1="290" y1="254" x2="256" y2="324" stroke="#52606d" stroke-width="2"/>
  <line x1="290" y1="254" x2="328" y2="324" stroke="#d9480f" stroke-width="4"/>
  <circle cx="190" cy="130" r="14" fill="#fff0e0" stroke="#f08c00" stroke-width="2"/><text x="190" y="134" font-size="11" fill="#1f2933" text-anchor="middle">孩子</text>
  <circle cx="290" cy="240" r="14" fill="#e7f0fd" stroke="#4c78c9" stroke-width="2"/><text x="290" y="244" font-size="11" fill="#1f2933" text-anchor="middle">家长</text>
  <text x="118" y="202" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">乖</text>
  <text x="252" y="180" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">哭闹</text>
  <text x="238" y="300" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">惩罚</text>
  <text x="342" y="300" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">让步</text>
  <text x="80" y="302" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">（2，3）</text>
  <text x="256" y="346" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">（0，0）</text>
  <text x="328" y="346" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">（3，1）</text>
  <text x="390" y="76" font-size="14" font-weight="600" fill="#1f2933">事先立下规矩，让步要丢脸（−2）</text>
  <rect x="588" y="206" width="146" height="196" rx="10" fill="#f4fbf6" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="661" y="390" font-size="12" fill="#2b8a3e" font-weight="600" text-anchor="middle">这一块是一个子博弈</text>
  <line x1="560" y1="144" x2="450" y2="280" stroke="#d9480f" stroke-width="4"/>
  <line x1="560" y1="144" x2="660" y2="226" stroke="#52606d" stroke-width="2"/>
  <line x1="660" y1="254" x2="626" y2="324" stroke="#d9480f" stroke-width="4"/>
  <line x1="660" y1="254" x2="698" y2="324" stroke="#52606d" stroke-width="2"/>
  <circle cx="560" cy="130" r="14" fill="#fff0e0" stroke="#f08c00" stroke-width="2"/><text x="560" y="134" font-size="11" fill="#1f2933" text-anchor="middle">孩子</text>
  <circle cx="660" cy="240" r="14" fill="#e7f0fd" stroke="#4c78c9" stroke-width="2"/><text x="660" y="244" font-size="11" fill="#1f2933" text-anchor="middle">家长</text>
  <text x="488" y="202" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">乖</text>
  <text x="622" y="180" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">哭闹</text>
  <text x="608" y="300" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">惩罚</text>
  <text x="712" y="300" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">让步</text>
  <text x="450" y="302" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">（2，3）</text>
  <text x="626" y="346" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">（0，0）</text>
  <text x="698" y="346" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">（3，−1）</text>
  <text x="24" y="420" font-size="13" fill="#d9480f" font-weight="600">左：到了那一刻，让步（1）比惩罚（0）更划算，所以"惩罚"是空话，孩子哭闹，结果（3，1）。</text>
  <text x="24" y="444" font-size="13" fill="#d9480f" font-weight="600">右：让步变成 −1，到那一刻家长真会惩罚，所以孩子乖乖的，家长反而得 3。括号里：（孩子，家长）。</text>
</svg>
