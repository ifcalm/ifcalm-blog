<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="10" fill="#ffffff"/>

  <text x="190" y="34" font-size="16" font-weight="600" fill="#1f2933" text-anchor="middle">决策：对面是拼图</text>
  <text x="570" y="34" font-size="16" font-weight="600" fill="#1f2933" text-anchor="middle">博弈：对面是棋手</text>
  <line x1="380" y1="48" x2="380" y2="270" stroke="#e4e7eb" stroke-width="1.5"/>

  <!-- left panel -->
  <rect x="50" y="110" width="90" height="56" rx="8" fill="#e7f0fd" stroke="#4c78c9" stroke-width="1.5"/>
  <text x="95" y="144" font-size="15" fill="#1f2933" text-anchor="middle">你</text>
  <rect x="240" y="110" width="110" height="56" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="295" y="144" font-size="15" fill="#1f2933" text-anchor="middle">天气 / 拼图</text>
  <line x1="142" y1="138" x2="238" y2="138" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <text x="190" y="128" font-size="12" fill="#52606d" text-anchor="middle">你选</text>
  <text x="190" y="200" font-size="13" fill="#52606d" text-anchor="middle">它不会因为你怎么选而改主意</text>
  <text x="190" y="222" font-size="13" fill="#52606d" text-anchor="middle">难点：预测它</text>

  <!-- right panel -->
  <rect x="420" y="110" width="90" height="56" rx="8" fill="#e7f0fd" stroke="#4c78c9" stroke-width="1.5"/>
  <text x="465" y="144" font-size="15" fill="#1f2933" text-anchor="middle">你</text>
  <rect x="630" y="110" width="90" height="56" rx="8" fill="#fff0e0" stroke="#f08c00" stroke-width="1.5"/>
  <text x="675" y="144" font-size="15" fill="#1f2933" text-anchor="middle">对方</text>
  <line x1="512" y1="128" x2="628" y2="128" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="628" y1="150" x2="512" y2="150" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <text x="570" y="118" font-size="12" fill="#52606d" text-anchor="middle">我怎么选</text>
  <text x="570" y="170" font-size="12" fill="#52606d" text-anchor="middle">他怎么选</text>
  <text x="570" y="200" font-size="13" fill="#52606d" text-anchor="middle">他也在猜你会怎么选</text>
  <text x="570" y="222" font-size="13" fill="#52606d" text-anchor="middle">难点：猜他怎么猜我</text>
</svg>
