<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="400" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">把"不知道对手是谁"写成树：自然先抽出对手的类型</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">数字：你（新进入者）的收益</text>
  <line x1="380" y1="86" x2="200" y2="170" stroke="#52606d" stroke-width="2"/>
  <line x1="380" y1="86" x2="560" y2="170" stroke="#52606d" stroke-width="2"/>
  <line x1="200" y1="170" x2="200" y2="262" stroke="#52606d" stroke-width="2"/>
  <line x1="560" y1="170" x2="560" y2="262" stroke="#52606d" stroke-width="2"/>
  <line x1="200" y1="262" x2="130" y2="350" stroke="#52606d" stroke-width="2"/>
  <line x1="200" y1="262" x2="270" y2="350" stroke="#52606d" stroke-width="2"/>
  <line x1="560" y1="262" x2="490" y2="350" stroke="#52606d" stroke-width="2"/>
  <line x1="560" y1="262" x2="630" y2="350" stroke="#52606d" stroke-width="2"/>
  <circle cx="380" cy="86" r="16" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="2"/>
  <text x="380" y="90" font-size="11" fill="#1f2933" text-anchor="middle">自然</text>
  <circle cx="200" cy="170" r="16" fill="#fff0e0" stroke="#f08c00" stroke-width="2"/>
  <text x="200" y="174" font-size="11" fill="#1f2933" text-anchor="middle">强硬</text>
  <circle cx="560" cy="170" r="16" fill="#fff0e0" stroke="#f08c00" stroke-width="2"/>
  <text x="560" y="174" font-size="11" fill="#1f2933" text-anchor="middle">软弱</text>
  <circle cx="200" cy="262" r="16" fill="#e7f0fd" stroke="#4c78c9" stroke-width="2"/>
  <text x="200" y="266" font-size="11" fill="#1f2933" text-anchor="middle">你</text>
  <circle cx="560" cy="262" r="16" fill="#e7f0fd" stroke="#4c78c9" stroke-width="2"/>
  <text x="560" y="266" font-size="11" fill="#1f2933" text-anchor="middle">你</text>
  <line x1="217" y1="262" x2="543" y2="262" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="380" y="252" font-size="13" fill="#d9480f" font-weight="600" text-anchor="middle">同一个信息集</text>
  <text x="380" y="284" font-size="12" fill="#d9480f" text-anchor="middle">你分不清在位者是哪一种</text>
  <text x="262" y="118" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">强硬：概率 p</text>
  <text x="498" y="118" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">软弱：概率 1 − p</text>
  <text x="140" y="316" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">不进入</text>
  <text x="262" y="316" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">进入</text>
  <text x="500" y="316" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">不进入</text>
  <text x="622" y="316" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">进入</text>
  <text x="130" y="372" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0</text>
  <text x="270" y="372" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">−1（被打压）</text>
  <text x="490" y="372" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0</text>
  <text x="630" y="372" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">+3（被接纳）</text>
</svg>
