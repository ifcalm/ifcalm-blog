  <text x="390.0" y="376" font-size="12" fill="#52606d" text-anchor="middle">最多谈几轮</text>
  <text x="24" y="406" font-size="12" fill="#7b8794">奇数轮：最后一个出价的人是你，占便宜；偶数轮：最后出价的是小周，你吃亏。轮数越多，越接近 52.6。</text>
