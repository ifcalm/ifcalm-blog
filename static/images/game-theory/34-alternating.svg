<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="430" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">轮流出价：谈的轮数不同，先出价的人分到的差得很远</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">每多谈一轮，蛋糕缩小到原来的 0.9。纵轴：先出价的人（你）分到多少（总共 100）</text>
  <line x1="100" y1="340" x2="680" y2="340" stroke="#9aa5b1" stroke-width="1.5"/>
