    <line x1="100" y1="282.5" x2="680" y2="282.5"/>
    <line x1="100" y1="225.0" x2="680" y2="225.0"/>
    <line x1="100" y1="167.5" x2="680" y2="167.5"/>
    <line x1="100" y1="110.0" x2="680" y2="110.0"/>
  </g>
  <g font-size="12" fill="#52606d" text-anchor="end">
    <text x="92" y="344.0">0</text>
    <text x="92" y="286.5">25</text>
    <text x="92" y="229.0">50</text>
    <text x="92" y="171.5">75</text>
    <text x="92" y="114.0">100</text>
  </g>
  <line x1="100" y1="218.9" x2="680" y2="218.9" stroke="#2f9e44" stroke-width="2" stroke-dasharray="6 5"/>
  <text paint-order="stroke" stroke="#ffffff" stroke-width="5" x="680" y="210.9" font-size="12" fill="#2f9e44" text-anchor="end">谈无限多轮：52.6</text>
