  <line x1="593.3333333333334" y1="255" x2="593.3333333333334" y2="265" stroke="#9aa5b1"/><text x="593.3333333333334" y="282" font-size="12" fill="#52606d" text-anchor="middle">50</text>
  <line x1="700.0" y1="255" x2="700.0" y2="265" stroke="#9aa5b1"/><text x="700.0" y="282" font-size="12" fill="#52606d" text-anchor="middle">60</text>
  <line x1="593.3" y1="95" x2="593.3" y2="260" stroke="#4c6ef5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="593.3" y="88" font-size="12" fill="#4c6ef5" text-anchor="middle" font-weight="600">第 0 层 50</text>
  <line x1="415.6" y1="95" x2="415.6" y2="260" stroke="#4c6ef5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="415.6" y="88" font-size="12" fill="#4c6ef5" text-anchor="middle" font-weight="600">第 1 层 33.3</text>
