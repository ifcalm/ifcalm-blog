  <line x1="273.33333333333337" y1="255" x2="273.33333333333337" y2="265" stroke="#9aa5b1"/><text x="273.33333333333337" y="282" font-size="12" fill="#52606d" text-anchor="middle">20</text>
  <line x1="380.0" y1="255" x2="380.0" y2="265" stroke="#9aa5b1"/><text x="380.0" y="282" font-size="12" fill="#52606d" text-anchor="middle">30</text>
