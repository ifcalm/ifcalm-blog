  <line x1="218.0" y1="95" x2="218.0" y2="260" stroke="#4c6ef5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="218.0" y="88" font-size="12" fill="#4c6ef5" text-anchor="middle" font-weight="600">第 3 层 14.8</text>
  <circle cx="593.3333333333334" cy="235" r="9" fill="#d9480f" opacity="0.85"/>
  <circle cx="540.0" cy="235" r="9" fill="#d9480f" opacity="0.85"/>
  <circle cx="486.6666666666667" cy="235" r="9" fill="#d9480f" opacity="0.85"/>
