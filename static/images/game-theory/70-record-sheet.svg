  <circle cx="60.0" cy="235" r="9" fill="#d9480f" opacity="0.85"/>
  <line x1="348.9" y1="130" x2="348.9" y2="260" stroke="#1f2933" stroke-width="3"/><text x="354.9" y="140" font-size="12" fill="#1f2933" font-weight="600">平均 27.1</text>
  <line x1="252.6" y1="160" x2="252.6" y2="260" stroke="#2b8a3e" stroke-width="3"/><text x="246.6" y="170" font-size="12" fill="#2b8a3e" font-weight="600" text-anchor="end">目标 18.1</text>
  <text x="24" y="320" font-size="13" fill="#1f2933">离目标 18.1 最近的是报 20 的人（差 1.9），其次是报 15 的人（差 3.1）。赢家是"第 2 到第 3 层之间"的人。</text>
  <text x="24" y="342" font-size="12" fill="#7b8794">没有人报 0，也没有人报 100：多数人落在 15 到 45 之间，是这个游戏最常见的样子。（这一页的数据是为演示而编的。）</text>
</svg>
