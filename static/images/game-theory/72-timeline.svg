<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="330" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">十三天：最危险的一天是 27 日</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">日期取自常见的叙述（1962 年）；个别事件的日期各来源略有出入，细节以原始档案为准</text>
  <line x1="50" y1="140" x2="710" y2="140" stroke="#9aa5b1" stroke-width="3"/>
  <circle cx="70" cy="140" r="9" fill="#4c6ef5"/><text x="70" y="118" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">10月14–16日</text>
  <text x="70" y="168" font-size="12" fill="#52606d" text-anchor="middle">发现导弹，</text>
  <text x="70" y="186" font-size="12" fill="#52606d" text-anchor="middle">执委会开会</text>
  <circle cx="190" cy="140" r="9" fill="#4c6ef5"/><text x="190" y="118" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">10月22日</text>
  <text x="190" y="168" font-size="12" fill="#52606d" text-anchor="middle">总统电视讲话，</text>
  <text x="190" y="186" font-size="12" fill="#52606d" text-anchor="middle">宣布隔离</text>
  <circle cx="310" cy="140" r="9" fill="#2b8a3e"/><text x="310" y="118" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">10月24日</text>
  <text x="310" y="168" font-size="12" fill="#52606d" text-anchor="middle">苏联船队</text>
  <text x="310" y="186" font-size="12" fill="#52606d" text-anchor="middle">在隔离线前停下</text>
  <circle cx="430" cy="140" r="9" fill="#9aa5b1"/><text x="430" y="118" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">10月26日</text>
  <text x="430" y="168" font-size="12" fill="#52606d" text-anchor="middle">赫鲁晓夫的</text>
  <text x="430" y="186" font-size="12" fill="#52606d" text-anchor="middle">第一封信</text>
  <circle cx="550" cy="140" r="9" fill="#d9480f"/><text x="550" y="118" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">10月27日</text>
  <text x="550" y="168" font-size="12" fill="#52606d" text-anchor="middle">第二封信；U-2 被击落；</text>
  <text x="550" y="186" font-size="12" fill="#52606d" text-anchor="middle">B-59 潜艇事件；</text>
  <text x="550" y="204" font-size="12" fill="#52606d" text-anchor="middle">夜间秘密会面</text>
  <circle cx="670" cy="140" r="9" fill="#2b8a3e"/><text x="670" y="118" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">10月28日</text>
  <text x="670" y="168" font-size="12" fill="#52606d" text-anchor="middle">赫鲁晓夫宣布</text>
  <text x="670" y="186" font-size="12" fill="#52606d" text-anchor="middle">撤走导弹</text>
  <text x="24" y="290" font-size="13" fill="#1f2933">隔离（blockade 被改称 quarantine）把"下一步升级"的决定交给了对方；27 日一天里，局势差点脱离双方的掌控。</text>
</svg>
