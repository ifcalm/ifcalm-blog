<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="420" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">换一个倍数：每深一层，数字往哪边走</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">第 0 层报 50；第 k 层报"上一层的 p 倍"（最多 100）。p 小于 1 往 0 缩，p 大于 1 往 100 涨</text>
  <text x="140" y="86" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">p = 1/2</text>
  <line x1="40" y1="300" x2="240" y2="300" stroke="#9aa5b1"/>
  <rect x="44" y="210.0" width="24" height="90.0" fill="#2b8a3e" opacity="0.85"/><text x="56" y="205.0" font-size="10" fill="#1f2933" text-anchor="middle">50</text><text x="56" y="316" font-size="11" fill="#52606d" text-anchor="middle">L0</text>
  <rect x="77" y="255.0" width="24" height="45.0" fill="#2b8a3e" opacity="0.85"/><text x="89" y="250.0" font-size="10" fill="#1f2933" text-anchor="middle">25</text><text x="89" y="316" font-size="11" fill="#52606d" text-anchor="middle">L1</text>
  <rect x="110" y="277.5" width="24" height="22.5" fill="#2b8a3e" opacity="0.85"/><text x="122" y="272.5" font-size="10" fill="#1f2933" text-anchor="middle">12.5</text><text x="122" y="316" font-size="11" fill="#52606d" text-anchor="middle">L2</text>
  <rect x="143" y="288.8" width="24" height="11.2" fill="#2b8a3e" opacity="0.85"/><text x="155" y="283.8" font-size="10" fill="#1f2933" text-anchor="middle">6.25</text><text x="155" y="316" font-size="11" fill="#52606d" text-anchor="middle">L3</text>
  <rect x="176" y="294.4" width="24" height="5.6" fill="#2b8a3e" opacity="0.85"/><text x="188" y="289.4" font-size="10" fill="#1f2933" text-anchor="middle">3.13</text><text x="188" y="316" font-size="11" fill="#52606d" text-anchor="middle">L4</text>
  <rect x="209" y="297.2" width="24" height="2.8" fill="#2b8a3e" opacity="0.85"/><text x="221" y="292.2" font-size="10" fill="#1f2933" text-anchor="middle">1.56</text><text x="221" y="316" font-size="11" fill="#52606d" text-anchor="middle">L5</text>
  <text x="140" y="346" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">均衡：0</text>
  <text x="380" y="86" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">p = 2/3</text>
  <line x1="280" y1="300" x2="480" y2="300" stroke="#9aa5b1"/>
  <rect x="284" y="210.0" width="24" height="90.0" fill="#4c6ef5" opacity="0.85"/><text x="296" y="205.0" font-size="10" fill="#1f2933" text-anchor="middle">50</text><text x="296" y="316" font-size="11" fill="#52606d" text-anchor="middle">L0</text>
  <rect x="317" y="240.0" width="24" height="60.0" fill="#4c6ef5" opacity="0.85"/><text x="329" y="235.0" font-size="10" fill="#1f2933" text-anchor="middle">33.33</text><text x="329" y="316" font-size="11" fill="#52606d" text-anchor="middle">L1</text>
  <rect x="350" y="260.0" width="24" height="40.0" fill="#4c6ef5" opacity="0.85"/><text x="362" y="255.0" font-size="10" fill="#1f2933" text-anchor="middle">22.22</text><text x="362" y="316" font-size="11" fill="#52606d" text-anchor="middle">L2</text>
  <rect x="383" y="273.3" width="24" height="26.7" fill="#4c6ef5" opacity="0.85"/><text x="395" y="268.3" font-size="10" fill="#1f2933" text-anchor="middle">14.81</text><text x="395" y="316" font-size="11" fill="#52606d" text-anchor="middle">L3</text>
  <rect x="416" y="282.2" width="24" height="17.8" fill="#4c6ef5" opacity="0.85"/><text x="428" y="277.2" font-size="10" fill="#1f2933" text-anchor="middle">9.88</text><text x="428" y="316" font-size="11" fill="#52606d" text-anchor="middle">L4</text>
  <rect x="449" y="288.2" width="24" height="11.8" fill="#4c6ef5" opacity="0.85"/><text x="461" y="283.2" font-size="10" fill="#1f2933" text-anchor="middle">6.58</text><text x="461" y="316" font-size="11" fill="#52606d" text-anchor="middle">L5</text>
  <text x="380" y="346" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">均衡：0</text>
  <text x="620" y="86" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">p = 4/3</text>
  <line x1="520" y1="300" x2="720" y2="300" stroke="#9aa5b1"/>
  <rect x="524" y="210.0" width="24" height="90.0" fill="#d9480f" opacity="0.85"/><text x="536" y="205.0" font-size="10" fill="#1f2933" text-anchor="middle">50</text><text x="536" y="316" font-size="11" fill="#52606d" text-anchor="middle">L0</text>
  <rect x="557" y="180.0" width="24" height="120.0" fill="#d9480f" opacity="0.85"/><text x="569" y="175.0" font-size="10" fill="#1f2933" text-anchor="middle">66.67</text><text x="569" y="316" font-size="11" fill="#52606d" text-anchor="middle">L1</text>
  <rect x="590" y="140.0" width="24" height="160.0" fill="#d9480f" opacity="0.85"/><text x="602" y="135.0" font-size="10" fill="#1f2933" text-anchor="middle">88.89</text><text x="602" y="316" font-size="11" fill="#52606d" text-anchor="middle">L2</text>
  <rect x="623" y="120.0" width="24" height="180.0" fill="#d9480f" opacity="0.85"/><text x="635" y="115.0" font-size="10" fill="#1f2933" text-anchor="middle">100</text><text x="635" y="316" font-size="11" fill="#52606d" text-anchor="middle">L3</text>
  <rect x="656" y="120.0" width="24" height="180.0" fill="#d9480f" opacity="0.85"/><text x="668" y="115.0" font-size="10" fill="#1f2933" text-anchor="middle">100</text><text x="668" y="316" font-size="11" fill="#52606d" text-anchor="middle">L4</text>
  <rect x="689" y="120.0" width="24" height="180.0" fill="#d9480f" opacity="0.85"/><text x="701" y="115.0" font-size="10" fill="#1f2933" text-anchor="middle">100</text><text x="701" y="316" font-size="11" fill="#52606d" text-anchor="middle">L5</text>
  <text x="620" y="346" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">均衡：0 和 100</text>
  <text x="24" y="392" font-size="12" fill="#7b8794">L0 到 L5 是第 0 到第 5 层。p = 4/3 时，所有人都报 100 也是均衡（目标超过 100，最近的就是 100）。</text>
</svg>
