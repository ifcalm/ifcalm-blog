<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="380" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">只能说"低"或"高"：两段话，对应两个动作</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">真实情况 θ 在 0 到 1 之间；小周总想把你往高处带 0.1。分界点 0.3：恰好在这里，小周说哪段都一样</text>
  <rect x="80" y="100" width="180.0" height="44" fill="#dbe7fb"/>
  <rect x="260.0" y="100" width="420.0" height="44" fill="#fde3cf"/>
  <line x1="260.0" y1="92" x2="260.0" y2="152" stroke="#52606d" stroke-width="2"/>
  <text x="170.0" y="128" font-size="14" fill="#1f2933" text-anchor="middle">说"低"</text>
  <text x="470.0" y="128" font-size="14" fill="#1f2933" text-anchor="middle">说"高"</text>
  <g font-size="12" fill="#52606d" text-anchor="middle">
    <text x="80" y="172">0</text><text x="260.0" y="172">0.3</text><text x="680" y="172">1</text>
  </g>
  <line x1="80" y1="152" x2="680" y2="152" stroke="#9aa5b1" stroke-width="1.5"/>
  <circle cx="170.0" cy="215" r="7" fill="#4c78c9"/>
  <text x="170.0" y="244" font-size="12" fill="#4c78c9" text-anchor="middle">听到"低"：你取中点 0.15</text>
  <circle cx="470.0" cy="215" r="7" fill="#d9480f"/>
  <text x="470.0" y="244" font-size="12" fill="#d9480f" text-anchor="middle">听到"高"：你取中点 0.65</text>
  <rect x="315.0" y="205" width="10" height="20" fill="#2f9e44"/>
  <text x="320.0" y="268" font-size="12" fill="#2f9e44" text-anchor="middle">θ=0.3 时小周心里想要的 0.4</text>
  <line x1="179.0" y1="215" x2="311.0" y2="215" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="329.0" y1="215" x2="461.0" y2="215" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="245.0" y="205" font-size="12" fill="#7b8794" text-anchor="middle">距离 0.25</text>
  <text x="395.0" y="205" font-size="12" fill="#7b8794" text-anchor="middle">距离 0.25</text>
  <text x="24" y="330" font-size="13" fill="#1f2933">到 0.4 的两个距离一样，所以 θ 刚好是 0.3 时，小周说"低"或"高"都行：这就是分界点。</text>
  <text x="24" y="352" font-size="12" fill="#7b8794">θ 小于 0.3，说"低"更接近小周想要的；θ 大于 0.3，说"高"更接近。</text>
</svg>
