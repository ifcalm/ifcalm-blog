  <line x1="293.0" y1="330" x2="293.0" y2="143.125" stroke="#2b8a3e" stroke-dasharray="5 4"/><circle cx="293.0" cy="143.125" r="5" fill="#2b8a3e"/>
  <line x1="380.0" y1="330" x2="380.0" y2="124.64285714285714" stroke="#52606d" stroke-dasharray="5 4"/><circle cx="380.0" cy="124.64285714285714" r="5" fill="#52606d"/>
