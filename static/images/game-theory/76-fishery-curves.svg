<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="450" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">渔场：多少渔船最划算，多少渔船会真的出海</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">稳态模型，数字是编的：每单位捕捞力度的成本 3，鱼的价格 10。横轴：全湖的总捕捞力度（可以想成渔船数）。纵轴：收入与成本</text>
  <line x1="90" y1="330" x2="670" y2="330" stroke="#9aa5b1" stroke-width="1.5"/>
