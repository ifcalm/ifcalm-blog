  <text x="285.0" y="117.1" font-size="12" fill="#2b8a3e" font-weight="600" text-anchor="end">利润最大：力度 17.5</text>
  <text x="380.0" y="114.6" font-size="12" fill="#52606d" font-weight="600" text-anchor="middle">鱼获最多：力度 25</text>
  <text x="490.2" y="280.7" font-size="12" fill="#d9480f" font-weight="600" text-anchor="end">没人再进来：力度 35，利润 0</text>
  <line x1="480" y1="100" x2="510" y2="100" stroke="#4c6ef5" stroke-width="3"/><text x="518" y="104" font-size="12" fill="#1f2933">收入 = 价格 × 鱼获</text>
  <line x1="480" y1="122" x2="510" y2="122" stroke="#d9480f" stroke-width="3"/><text x="518" y="126" font-size="12" fill="#1f2933">成本 = 3 × 力度</text>
  <text x="90.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">0</text>
  <text x="206.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">10</text>
  <text x="322.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">20</text>
  <text x="438.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">30</text>
  <text x="554.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">40</text>
  <text x="670.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">50</text>
  <text x="82" y="334.0" font-size="12" fill="#52606d" text-anchor="end">0</text>
  <text x="82" y="251.9" font-size="12" fill="#52606d" text-anchor="end">50</text>
  <text x="82" y="169.7" font-size="12" fill="#52606d" text-anchor="end">100</text>
  <text x="380.0" y="368" font-size="12" fill="#52606d" text-anchor="middle">总捕捞力度</text>
  <text x="24" y="398" font-size="13" fill="#1f2933">收入曲线和成本线的距离就是利润。利润最大在力度 17.5；可是只要还有利润，就有新渔船进来，直到力度 35，利润被摊成 0。</text>
  <text x="24" y="420" font-size="12" fill="#7b8794">力度 35 时的湖里，鱼只剩 30（力度 17.5 时是 65），总鱼获还略少（10.5 对 11.375）。</text>
</svg>
