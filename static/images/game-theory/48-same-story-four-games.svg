<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="470" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">同一个故事，换几个数字，就是四种不同的博弈</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">你和小周共用一条小路。修路的总成本是 10，路修好后每人得到 b 的好处。格子里是（你，小周）的收益；橙色框是纯策略均衡</text>
  <text x="180" y="80" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">分摊修路，b = 4：没有困境</text>
  <text x="180" y="98" font-size="11" fill="#7b8794" text-anchor="middle">好处太小，谁也不想修</text>
  <text x="190" y="124" font-size="12" fill="#52606d" text-anchor="middle">小周：修</text><text x="280" y="124" font-size="12" fill="#52606d" text-anchor="middle">小周：不修</text>
  <text x="138" y="162" font-size="12" fill="#52606d" text-anchor="end">你：修</text><text x="138" y="212" font-size="12" fill="#52606d" text-anchor="end">你：不修</text>
  <rect x="145" y="132" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="190" y="162" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">−1，−1</text>
  <rect x="235" y="132" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="280" y="162" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">−6，4</text>
  <rect x="145" y="182" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="190" y="212" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">4，−6</text>
  <rect x="235" y="182" width="90" height="50" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="280" y="212" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">0，0</text>
  <text x="560" y="80" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">分摊修路，b = 7：囚徒困境</text>
  <text x="560" y="98" font-size="11" fill="#7b8794" text-anchor="middle">一起修（2，2）比谁都不修好，却没人愿意先修</text>
  <text x="570" y="124" font-size="12" fill="#52606d" text-anchor="middle">小周：修</text><text x="660" y="124" font-size="12" fill="#52606d" text-anchor="middle">小周：不修</text>
  <text x="518" y="162" font-size="12" fill="#52606d" text-anchor="end">你：修</text><text x="518" y="212" font-size="12" fill="#52606d" text-anchor="end">你：不修</text>
  <rect x="525" y="132" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="570" y="162" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">2，2</text>
  <rect x="615" y="132" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="660" y="162" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">−3，7</text>
  <rect x="525" y="182" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="570" y="212" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">7，−3</text>
  <rect x="615" y="182" width="90" height="50" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="660" y="212" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">0，0</text>
  <text x="180" y="260" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">分摊修路，b = 12：扫雪</text>
  <text x="180" y="278" font-size="11" fill="#7b8794" text-anchor="middle">好处大，一个人修也值得；最好有人出头</text>
  <text x="190" y="304" font-size="12" fill="#52606d" text-anchor="middle">小周：修</text><text x="280" y="304" font-size="12" fill="#52606d" text-anchor="middle">小周：不修</text>
  <text x="138" y="342" font-size="12" fill="#52606d" text-anchor="end">你：修</text><text x="138" y="392" font-size="12" fill="#52606d" text-anchor="end">你：不修</text>
  <rect x="145" y="312" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="190" y="342" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">7，7</text>
  <rect x="235" y="312" width="90" height="50" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="280" y="342" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">2，12</text>
  <rect x="145" y="362" width="90" height="50" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="190" y="392" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">12，2</text>
  <rect x="235" y="362" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="280" y="392" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">0，0</text>
  <text x="560" y="260" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">必须两人合力，b = 12：猎鹿</text>
  <text x="560" y="278" font-size="11" fill="#7b8794" text-anchor="middle">一个人修不成，白白付出 10</text>
  <text x="570" y="304" font-size="12" fill="#52606d" text-anchor="middle">小周：修</text><text x="660" y="304" font-size="12" fill="#52606d" text-anchor="middle">小周：不修</text>
  <text x="518" y="342" font-size="12" fill="#52606d" text-anchor="end">你：修</text><text x="518" y="392" font-size="12" fill="#52606d" text-anchor="end">你：不修</text>
  <rect x="525" y="312" width="90" height="50" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="570" y="342" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">2，2</text>
  <rect x="615" y="312" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="660" y="342" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">−10，0</text>
  <rect x="525" y="362" width="90" height="50" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="570" y="392" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">0，−10</text>
  <rect x="615" y="362" width="90" height="50" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="660" y="392" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">0，0</text>
</svg>
