<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="410" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">如果回应者不是"只要有钱就接受"，最好的提议就不再是 1 元</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">数字是为了手算而设的示意：每个提议被接受的概率；提议者的期望收益 = (10 − 提议) × 接受概率</text>
  <line x1="90" y1="320" x2="690" y2="320" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="120" y="287.0" width="70" height="33.0" rx="3" fill="#4c78c9"/>
  <text x="155" y="279.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0.9</text>
  <text x="155" y="342" font-size="13" fill="#52606d" text-anchor="middle">给 1 元</text>
  <text x="155" y="362" font-size="12" fill="#7b8794" text-anchor="middle">接受概率 10%</text>
  <rect x="232" y="232.0" width="70" height="88.0" rx="3" fill="#4c78c9"/>
  <text x="267" y="224.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">2.4</text>
  <text x="267" y="342" font-size="13" fill="#52606d" text-anchor="middle">给 2 元</text>
  <text x="267" y="362" font-size="12" fill="#7b8794" text-anchor="middle">接受概率 30%</text>
  <rect x="344" y="166.0" width="70" height="154.0" rx="3" fill="#4c78c9"/>
  <text x="379" y="158.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">4.2</text>
  <text x="379" y="342" font-size="13" fill="#52606d" text-anchor="middle">给 3 元</text>
  <text x="379" y="362" font-size="12" fill="#7b8794" text-anchor="middle">接受概率 60%</text>
  <rect x="456" y="133.0" width="70" height="187.0" rx="3" fill="#d9480f"/>
  <text x="491" y="125.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">5.1</text>
  <text x="491" y="342" font-size="13" fill="#52606d" text-anchor="middle">给 4 元</text>
  <text x="491" y="362" font-size="12" fill="#7b8794" text-anchor="middle">接受概率 85%</text>
  <rect x="568" y="136.7" width="70" height="183.3" rx="3" fill="#4c78c9"/>
  <text x="603" y="128.7" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">5.0</text>
  <text x="603" y="342" font-size="13" fill="#52606d" text-anchor="middle">给 5 元</text>
  <text x="603" y="362" font-size="12" fill="#7b8794" text-anchor="middle">接受概率 100%</text>
</svg>
