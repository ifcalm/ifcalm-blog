<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="440" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">"两边成功率差不多"：要多少次发球才看得出来差别？</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">左右两边各发 n 次，成功率约 0.62。纵轴：以 80% 的把握、5% 的显著水平能看出的最小差距</text>
  <line x1="90" y1="330" x2="670" y2="330" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="90" y1="110" x2="90" y2="330" stroke="#9aa5b1" stroke-width="1.5"/>
  <polyline points="90.0,118.6 96.1,137.0 102.2,151.3 108.3,162.9 114.4,172.4 120.5,180.5 126.6,187.5 132.7,193.5 138.8,198.9 144.9,203.7 151.1,207.9 157.2,211.8 163.3,215.3 169.4,218.6 175.5,221.5 181.6,224.3 187.7,226.8 193.8,229.2 199.9,231.4 206.0,233.5 212.1,235.4 218.2,237.3 224.3,239.0 230.4,240.7 236.5,242.2 242.6,243.7 248.7,245.1 254.8,246.4 260.9,247.7 267.1,248.9 273.2,250.1 279.3,251.2 285.4,252.3 291.5,253.3 297.6,254.3 303.7,255.3 309.8,256.2 315.9,257.1 322.0,257.9 328.1,258.7 334.2,259.5 340.3,260.3 346.4,261.0 352.5,261.8 358.6,262.5 364.7,263.1 370.8,263.8 376.9,264.4 383.1,265.1 389.2,265.7 395.3,266.3 401.4,266.8 407.5,267.4 413.6,267.9 419.7,268.5 425.8,269.0 431.9,269.5 438.0,270.0 444.1,270.4 450.2,270.9 456.3,271.4 462.4,271.8 468.5,272.2 474.6,272.7 480.7,273.1 486.8,273.5 492.9,273.9 499.1,274.3 505.2,274.7 511.3,275.0 517.4,275.4 523.5,275.8 529.6,276.1 535.7,276.5 541.8,276.8 547.9,277.1 554.0,277.5 560.1,277.8 566.2,278.1 572.3,278.4 578.4,278.7 584.5,279.0 590.6,279.3 596.7,279.6 602.8,279.9 608.9,280.2 615.1,280.4 621.2,280.7 627.3,281.0 633.4,281.2 639.5,281.5 645.6,281.7 651.7,282.0 657.8,282.2 663.9,282.5 670.0,282.7" fill="none" stroke="#d9480f" stroke-width="3"/>
  <circle cx="120.5" cy="180.5" r="5" fill="#1f2933"/><text x="130.5" y="172.5" font-size="12" fill="#1f2933" font-weight="600">n = 200：约 13.6 个百分点</text>
  <circle cx="364.7" cy="263.1" r="5" fill="#1f2933"/><text x="374.7" y="255.1" font-size="12" fill="#1f2933" font-weight="600">n = 1000：约 6.1</text>
  <circle cx="510.7" cy="275.0" r="5" fill="#1f2933"/><text x="520.7" y="267.0" font-size="12" fill="#1f2933" font-weight="600">n ≈ 1500：约 5.0</text>
  <text x="82" y="334.0" font-size="12" fill="#52606d" text-anchor="end">0</text>
  <text x="82" y="279.0" font-size="12" fill="#52606d" text-anchor="end">5</text>
  <text x="82" y="224.0" font-size="12" fill="#52606d" text-anchor="end">10</text>
  <text x="82" y="169.0" font-size="12" fill="#52606d" text-anchor="end">15</text>
  <text x="82" y="114.0" font-size="12" fill="#52606d" text-anchor="end">20</text>
  <text x="120.5" y="348" font-size="12" fill="#52606d" text-anchor="middle">200</text>
  <text x="212.1" y="348" font-size="12" fill="#52606d" text-anchor="middle">500</text>
  <text x="364.7" y="348" font-size="12" fill="#52606d" text-anchor="middle">1000</text>
  <text x="517.4" y="348" font-size="12" fill="#52606d" text-anchor="middle">1500</text>
  <text x="670.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">2000</text>
  <text x="380.0" y="368" font-size="12" fill="#52606d" text-anchor="middle">每边的发球次数 n</text>
  <text x="24" y="398" font-size="13" fill="#1f2933">左右两边各 200 次时，13 个百分点以内的差别都看不出来；要看出 5 个点的差别，每边要约 1500 次。</text>
  <text x="24" y="420" font-size="12" fill="#7b8794">所以"没发现差别"和"没有差别"是两回事：样本少的检验，什么都"检验不出"。</text>
</svg>
