<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="400" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">牧民越多，草场上的羊越多，全村赚得越少</text>
  <line x1="90" y1="330" x2="690" y2="330" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="130" y="130.0" width="90" height="200.0" rx="3" fill="#4c78c9"/>
  <text x="175" y="120.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">2500</text>
  <text x="175" y="352" font-size="13" fill="#52606d" text-anchor="middle">1 位牧民</text>
  <text x="175" y="372" font-size="12" fill="#d9480f" text-anchor="middle">羊共 50</text>
  <rect x="280" y="152.2" width="90" height="177.8" rx="3" fill="#4c78c9"/>
  <text x="325" y="142.2" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">2222</text>
  <text x="325" y="352" font-size="13" fill="#52606d" text-anchor="middle">2 位牧民</text>
  <text x="325" y="372" font-size="12" fill="#d9480f" text-anchor="middle">羊共 66.7</text>
  <rect x="430" y="218.9" width="90" height="111.1" rx="3" fill="#4c78c9"/>
  <text x="475" y="208.9" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">1389</text>
  <text x="475" y="352" font-size="13" fill="#52606d" text-anchor="middle">5 位牧民</text>
  <text x="475" y="372" font-size="12" fill="#d9480f" text-anchor="middle">羊共 83.3</text>
  <rect x="580" y="263.9" width="90" height="66.1" rx="3" fill="#4c78c9"/>
  <text x="625" y="253.9" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">826</text>
  <text x="625" y="352" font-size="13" fill="#52606d" text-anchor="middle">10 位牧民</text>
  <text x="625" y="372" font-size="12" fill="#d9480f" text-anchor="middle">羊共 90.9</text>
  <text x="24" y="60" font-size="12" fill="#7b8794">柱子：全村每年的总利润（越高越好）；下方橙字：全村放的羊总数（50 最合适）</text>
</svg>
