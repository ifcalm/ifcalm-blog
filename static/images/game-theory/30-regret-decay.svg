<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="440" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">遗憾匹配：平均每轮的"后悔"一路降向 0</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">两个人都用遗憾匹配玩石头剪刀布。纵轴：事后看，最该换的那个动作平均每轮能多赚多少（对数坐标）</text>
  <line x1="100" y1="330" x2="680" y2="330" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="100" y1="330" x2="100" y2="110" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="100" y1="298.6" x2="680" y2="298.6" stroke="#e4e7eb"/><text x="92" y="302.6" font-size="12" fill="#52606d" text-anchor="end">0.001</text>
  <line x1="100" y1="235.7" x2="680" y2="235.7" stroke="#e4e7eb"/><text x="92" y="239.7" font-size="12" fill="#52606d" text-anchor="end">0.01</text>
  <line x1="100" y1="172.9" x2="680" y2="172.9" stroke="#e4e7eb"/><text x="92" y="176.9" font-size="12" fill="#52606d" text-anchor="end">0.1</text>
  <line x1="100" y1="110.0" x2="680" y2="110.0" stroke="#e4e7eb"/><text x="92" y="114.0" font-size="12" fill="#52606d" text-anchor="end">1</text>
  <text x="100.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">10</text>
  <text x="245.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">100</text>
  <text x="390.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">1,000</text>
  <text x="535.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">10,000</text>
  <text x="680.0" y="348" font-size="12" fill="#52606d" text-anchor="middle">100,000</text>
  <text x="390.0" y="370" font-size="12" fill="#52606d" text-anchor="middle">已玩的轮数（对数坐标）</text>
  <polyline points="100.0,141.4 169.2,156.4 245.0,172.9 314.2,187.9 390.0,204.3 459.2,219.3 535.0,235.7 604.2,250.7 680.0,267.1" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="284.2" y="241.9" font-size="12" fill="#7b8794">灰虚线：1 ÷ √轮数</text>
  <polyline points="100.0,142.9 169.2,155.5 245.0,166.4 314.2,177.7 390.0,195.6 459.2,203.5 535.0,230.9 604.2,239.7 680.0,260.3" fill="none" stroke="#d9480f" stroke-width="3"/>
  <circle cx="100.0" cy="142.9" r="4" fill="#d9480f"/>
  <circle cx="169.2" cy="155.5" r="4" fill="#d9480f"/>
  <circle cx="245.0" cy="166.4" r="4" fill="#d9480f"/>
  <circle cx="314.2" cy="177.7" r="4" fill="#d9480f"/>
  <circle cx="390.0" cy="195.6" r="4" fill="#d9480f"/>
  <circle cx="459.2" cy="203.5" r="4" fill="#d9480f"/>
  <circle cx="535.0" cy="230.9" r="4" fill="#d9480f"/>
  <circle cx="604.2" cy="239.7" r="4" fill="#d9480f"/>
  <circle cx="680.0" cy="260.3" r="4" fill="#d9480f"/>
  <text x="399.2" y="263.5" font-size="13" fill="#d9480f" font-weight="600">实际：每轮后悔下降</text>
  <text x="24" y="412" font-size="12" fill="#7b8794">六次随机模拟的平均。后悔降到十万轮时约 0.004，大致是 1 ÷ √轮数 的量级。</text>
</svg>
