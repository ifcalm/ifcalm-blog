<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="470" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">三个人分 100：核是中间一小块</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">三人单干得 0，任意两人联手能得 60，三人一起能得 100。图中每个点是一种分法：越靠近哪个角，那个人分得越多</text>
  <polygon points="380.0,90.0 130.0,400.0 630.0,400.0" fill="#fafbfc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="380" y="80" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">你拿走全部 100</text>
  <text x="130" y="422" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">小周拿走全部</text>
  <text x="630" y="422" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">小林拿走全部</text>
  <polygon points="330.0,276.0 430.0,276.0 380.0,338.0" fill="#bfe5c8" stroke="#2f9e44" stroke-width="2.5"/>
  <polygon points="380.0,90.0 230.0,276.0 530.0,276.0" fill="#fdebe5" stroke="#d9480f" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="130.0,400.0 280.0,214.0 430.0,400.0" fill="#fdebe5" stroke="#d9480f" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="630.0,400.0 480.0,214.0 330.0,400.0" fill="#fdebe5" stroke="#d9480f" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="380.0" cy="296.7" r="6" fill="#1f2933"/><text x="390.0" y="300.7" font-size="12" fill="#1f2933">平分 (33, 33, 33)</text>
  <circle cx="355.0" cy="245.0" r="6" fill="#d9480f"/><text x="365.0" y="249.0" font-size="12" fill="#d9480f">(50, 30, 20) 被小周和小林联手推翻：他们只得 50 &lt; 60</text>
  <text x="322.0" y="292.0" font-size="11" fill="#2f9e44" text-anchor="end">(40, 40, 20)</text>
  <text x="24" y="440" font-size="12" fill="#7b8794">绿色三角：核（每个人都不超过 40，也都不少于 20）。红色虚线角：某个人拿到超过 40，剩下两人合起来不到 60，会联手另起炉灶。</text>
</svg>
