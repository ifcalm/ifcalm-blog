<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="400" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">抽签打破并列时，延迟接受也可能"让大家都能更好却没做到"</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">线上的字是这个学校在学生志愿里的名次（第 1、2、3 志愿）。a：Y > X > Z；b：Y > Z > X；c：Z > Y > X</text>
  <text x="170" y="90" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">某一种抽签结果下的分配</text>
  <circle cx="80" cy="130" r="18" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="80" y="135" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">a</text>
  <circle cx="80" cy="190" r="18" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="80" y="195" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">b</text>
  <circle cx="80" cy="250" r="18" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="80" y="255" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">c</text>
  <rect x="230" y="112" width="36" height="36" rx="6" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="248" y="135" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">X</text>
  <rect x="230" y="172" width="36" height="36" rx="6" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="248" y="195" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">Y</text>
  <rect x="230" y="232" width="36" height="36" rx="6" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="248" y="255" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">Z</text>
  <line x1="98" y1="130" x2="230" y2="130" stroke="#52606d" stroke-width="2.5"/><text x="164.0" y="125.0" font-size="11" fill="#52606d" text-anchor="middle" font-weight="600">第 2</text>
  <line x1="98" y1="250" x2="230" y2="190" stroke="#52606d" stroke-width="2.5"/><text x="164.0" y="215.0" font-size="11" fill="#52606d" text-anchor="middle" font-weight="600">第 2</text>
  <line x1="98" y1="190" x2="230" y2="250" stroke="#52606d" stroke-width="2.5"/><text x="164.0" y="215.0" font-size="11" fill="#52606d" text-anchor="middle" font-weight="600">第 2</text>
  <text x="530" y="90" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">另一种分配（没有人更差）</text>
  <circle cx="440" cy="130" r="18" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="440" y="135" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">a</text>
  <circle cx="440" cy="190" r="18" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="440" y="195" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">b</text>
  <circle cx="440" cy="250" r="18" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="440" y="255" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">c</text>
  <rect x="590" y="112" width="36" height="36" rx="6" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="608" y="135" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">X</text>
  <rect x="590" y="172" width="36" height="36" rx="6" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="608" y="195" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">Y</text>
  <rect x="590" y="232" width="36" height="36" rx="6" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2"/><text x="608" y="255" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="600">Z</text>
  <line x1="458" y1="130" x2="590" y2="130" stroke="#52606d" stroke-width="2.5"/><text x="524.0" y="125.0" font-size="11" fill="#52606d" text-anchor="middle" font-weight="600">第 2</text>
  <line x1="458" y1="190" x2="590" y2="190" stroke="#2b8a3e" stroke-width="2.5"/><text x="524.0" y="185.0" font-size="11" fill="#2b8a3e" text-anchor="middle" font-weight="600">第 1</text>
  <line x1="458" y1="250" x2="590" y2="250" stroke="#2b8a3e" stroke-width="2.5"/><text x="524.0" y="245.0" font-size="11" fill="#2b8a3e" text-anchor="middle" font-weight="600">第 1</text>
  <text x="24" y="330" font-size="13" fill="#1f2933">左：三个人都拿到第 2 志愿。右：a 不变，b、c 都拿到第 1 志愿。右边没有违反任何一所学校的优先顺序（只有并列）。</text>
  <text x="24" y="352" font-size="12" fill="#7b8794">在这个例子里，6 种抽签顺序只有 1 种得到左边的结果；其余 5 种里，都没有办法在不伤害任何人的前提下让谁更好。</text>
</svg>
