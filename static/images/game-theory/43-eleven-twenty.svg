<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="460" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">"11–20 要钱游戏"：k 层推理的脚印，和均衡的混合策略</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">每人报 11 到 20 之间的整数，拿到那么多钱；如果你的数恰好比对方少 1，再奖励 20。柱子：均衡时每个数被选中的概率</text>
  <line x1="70" y1="330" x2="710" y2="330" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="102.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">11</text>
  <text x="166.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">12</text>
  <text x="230.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">13</text>
  <text x="294.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">14</text>
  <rect x="336.0" y="146.7" width="44" height="183.3" fill="#4c6ef5" opacity="0.85"/>
  <text x="358.0" y="140.7" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">25%</text>
  <text x="358.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">15</text>
  <text x="358.0" y="370" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="600">L5</text>
  <rect x="400.0" y="146.7" width="44" height="183.3" fill="#4c6ef5" opacity="0.85"/>
  <text x="422.0" y="140.7" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">25%</text>
  <text x="422.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">16</text>
  <text x="422.0" y="370" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="600">L4</text>
  <rect x="464.0" y="183.3" width="44" height="146.7" fill="#4c6ef5" opacity="0.85"/>
  <text x="486.0" y="177.3" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">20%</text>
  <text x="486.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">17</text>
  <text x="486.0" y="370" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="600">L3</text>
  <rect x="528.0" y="220.0" width="44" height="110.0" fill="#4c6ef5" opacity="0.85"/>
  <text x="550.0" y="214.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">15%</text>
  <text x="550.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">18</text>
  <text x="550.0" y="370" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="600">L2</text>
  <rect x="592.0" y="256.7" width="44" height="73.3" fill="#4c6ef5" opacity="0.85"/>
  <text x="614.0" y="250.7" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">10%</text>
  <text x="614.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">19</text>
  <text x="614.0" y="370" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="600">L1</text>
  <rect x="656.0" y="293.3" width="44" height="36.7" fill="#4c6ef5" opacity="0.85"/>
  <text x="678.0" y="287.3" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">5%</text>
  <text x="678.0" y="350" font-size="13" fill="#52606d" text-anchor="middle">20</text>
  <text x="678.0" y="370" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="600">L0</text>
  <text x="24" y="370" font-size="12" fill="#d9480f">层数</text>
  <text x="390.0" y="392" font-size="12" fill="#52606d" text-anchor="middle">你报的数</text>
  <text x="24" y="424" font-size="12" fill="#1f2933">L0 报 20；L1 针对 L0，报 19；L2 针对 L1，报 18；……一路往下，每深一层少报 1。</text>
  <text x="24" y="444" font-size="12" fill="#7b8794">均衡只用 15 到 20；实验里最常见的是 L3（17）和 L2（18），约各三成（转引，没核对原文）。</text>
</svg>
