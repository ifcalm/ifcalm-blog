<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="420" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">谁赚得多，取决于竞争的是数量还是价格</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">蓝柱：先动者（或同时选时的甲方）；橙柱：跟随者（或同时选时的乙方）</text>
  <text x="40" y="82" font-size="14" font-weight="600" fill="#1f2933">比数量：先动者占便宜</text>
  <line x1="40" y1="340" x2="380" y2="340" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="50" y="150.4" width="44" height="189.6" rx="3" fill="#4c78c9"/>
  <text x="72" y="142.4" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">711</text>
  <rect x="102" y="150.4" width="44" height="189.6" rx="3" fill="#f08c00"/>
  <text x="124" y="142.4" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">711</text>
  <text x="102" y="360" font-size="12" fill="#52606d" text-anchor="middle">同时选</text>
  <rect x="180" y="126.7" width="44" height="213.3" rx="3" fill="#4c78c9"/>
  <text x="202" y="118.7" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">800</text>
  <rect x="232" y="233.3" width="44" height="106.7" rx="3" fill="#f08c00"/>
  <text x="254" y="225.3" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">400</text>
  <text x="232" y="360" font-size="12" fill="#52606d" text-anchor="middle">先动</text>
  <text x="400" y="82" font-size="14" font-weight="600" fill="#1f2933">比价格（产品有差异）：跟随者占便宜</text>
  <line x1="400" y1="340" x2="740" y2="340" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="410" y="124.0" width="44" height="216.0" rx="3" fill="#4c78c9"/>
  <text x="432" y="116.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">1800</text>
  <rect x="462" y="124.0" width="44" height="216.0" rx="3" fill="#f08c00"/>
  <text x="484" y="116.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">1800</text>
  <text x="462" y="360" font-size="12" fill="#52606d" text-anchor="middle">同时选</text>
  <rect x="540" y="123.0" width="44" height="217.0" rx="3" fill="#4c78c9"/>
  <text x="562" y="115.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">1808</text>
  <rect x="592" y="116.2" width="44" height="223.8" rx="3" fill="#f08c00"/>
  <text x="614" y="108.2" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">1865</text>
  <text x="592" y="360" font-size="12" fill="#52606d" text-anchor="middle">先动</text>
</svg>
