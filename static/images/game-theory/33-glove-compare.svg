<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="420" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">同一个手套博弈，三种分法差得很远</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">你有一只左手套，小周和小林各有一只右手套，一副值 100。柱子：你 / 小周 / 小林 各分到多少</text>
  <line x1="90" y1="330" x2="690" y2="330" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="120" y="110.0" width="44" height="220.0" rx="3" fill="#d9480f"/>
  <text x="142" y="103.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">100</text>
  <rect x="172" y="330.0" width="44" height="1.0" rx="3" fill="#4c78c9"/>
  <text x="194" y="323.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">0</text>
  <rect x="224" y="330.0" width="44" height="1.0" rx="3" fill="#2f9e44"/>
  <text x="246" y="323.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">0</text>
  <text x="198" y="354" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">核</text>
  <rect x="320" y="183.3" width="44" height="146.7" rx="3" fill="#d9480f"/>
  <text x="342" y="176.3" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">66.7</text>
  <rect x="372" y="293.3" width="44" height="36.7" rx="3" fill="#4c78c9"/>
  <text x="394" y="286.3" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">16.7</text>
  <rect x="424" y="293.3" width="44" height="36.7" rx="3" fill="#2f9e44"/>
  <text x="446" y="286.3" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">16.7</text>
  <text x="398" y="354" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">Shapley 值</text>
  <rect x="520" y="256.7" width="44" height="73.3" rx="3" fill="#d9480f"/>
  <text x="542" y="249.7" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">33.3</text>
  <rect x="572" y="256.7" width="44" height="73.3" rx="3" fill="#4c78c9"/>
  <text x="594" y="249.7" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">33.3</text>
  <rect x="624" y="256.7" width="44" height="73.3" rx="3" fill="#2f9e44"/>
  <text x="646" y="249.7" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">33.3</text>
  <text x="598" y="354" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">平分</text>
  <rect x="90" y="374" width="14" height="14" fill="#d9480f"/><text x="110" y="386" font-size="12" fill="#52606d">你</text>
  <rect x="180" y="374" width="14" height="14" fill="#4c78c9"/><text x="200" y="386" font-size="12" fill="#52606d">小周</text>
  <rect x="270" y="374" width="14" height="14" fill="#2f9e44"/><text x="290" y="386" font-size="12" fill="#52606d">小林</text>
  <text x="24" y="406" font-size="12" fill="#7b8794">核：稀缺的人拿走全部；Shapley 值：按"平均新增贡献"，你拿 2/3；平分：不看稀缺。</text>
</svg>
