<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="420" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">同一组偏好，三种稳定的分法：一方好，另一方就差</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">格子里的数字：这一方得到的是自己心里的第几志愿（1 最好，3 最差）</text>
  <rect x="30" y="80" width="220" height="250" rx="10" fill="#fafbfc" stroke="#e4e7eb"/>
  <text x="140" y="106" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">学生最满意的稳定分法</text>
  <text x="140" y="126" font-size="11" fill="#52606d" text-anchor="middle">你—A，小周—B，小林—C</text>
  <text x="46" y="160" font-size="12" fill="#52606d">学生</text>
  <rect x="46" y="168" width="58" height="52" rx="6" fill="#2f9e44"/><text x="75" y="190" font-size="12" fill="#ffffff" text-anchor="middle">你</text><text x="75" y="212" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="112" y="168" width="58" height="52" rx="6" fill="#2f9e44"/><text x="141" y="190" font-size="12" fill="#ffffff" text-anchor="middle">小周</text><text x="141" y="212" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="178" y="168" width="58" height="52" rx="6" fill="#2f9e44"/><text x="207" y="190" font-size="12" fill="#ffffff" text-anchor="middle">小林</text><text x="207" y="212" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <text x="46" y="252" font-size="12" fill="#52606d">公司</text>
  <rect x="46" y="260" width="58" height="52" rx="6" fill="#d9480f"/><text x="75" y="282" font-size="12" fill="#ffffff" text-anchor="middle">公司 A</text><text x="75" y="304" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="112" y="260" width="58" height="52" rx="6" fill="#d9480f"/><text x="141" y="282" font-size="12" fill="#ffffff" text-anchor="middle">公司 B</text><text x="141" y="304" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="178" y="260" width="58" height="52" rx="6" fill="#d9480f"/><text x="207" y="282" font-size="12" fill="#ffffff" text-anchor="middle">公司 C</text><text x="207" y="304" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="270" y="80" width="220" height="250" rx="10" fill="#fafbfc" stroke="#e4e7eb"/>
  <text x="380" y="106" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">折中的稳定分法</text>
  <text x="380" y="126" font-size="11" fill="#52606d" text-anchor="middle">你—B，小周—C，小林—A</text>
  <text x="286" y="160" font-size="12" fill="#52606d">学生</text>
  <rect x="286" y="168" width="58" height="52" rx="6" fill="#e0b43c"/><text x="315" y="190" font-size="12" fill="#ffffff" text-anchor="middle">你</text><text x="315" y="212" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="352" y="168" width="58" height="52" rx="6" fill="#e0b43c"/><text x="381" y="190" font-size="12" fill="#ffffff" text-anchor="middle">小周</text><text x="381" y="212" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="418" y="168" width="58" height="52" rx="6" fill="#e0b43c"/><text x="447" y="190" font-size="12" fill="#ffffff" text-anchor="middle">小林</text><text x="447" y="212" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <text x="286" y="252" font-size="12" fill="#52606d">公司</text>
  <rect x="286" y="260" width="58" height="52" rx="6" fill="#e0b43c"/><text x="315" y="282" font-size="12" fill="#ffffff" text-anchor="middle">公司 A</text><text x="315" y="304" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="352" y="260" width="58" height="52" rx="6" fill="#e0b43c"/><text x="381" y="282" font-size="12" fill="#ffffff" text-anchor="middle">公司 B</text><text x="381" y="304" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="418" y="260" width="58" height="52" rx="6" fill="#e0b43c"/><text x="447" y="282" font-size="12" fill="#ffffff" text-anchor="middle">公司 C</text><text x="447" y="304" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="510" y="80" width="220" height="250" rx="10" fill="#fafbfc" stroke="#e4e7eb"/>
  <text x="620" y="106" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">公司最满意的稳定分法</text>
  <text x="620" y="126" font-size="11" fill="#52606d" text-anchor="middle">你—C，小周—A，小林—B</text>
  <text x="526" y="160" font-size="12" fill="#52606d">学生</text>
  <rect x="526" y="168" width="58" height="52" rx="6" fill="#d9480f"/><text x="555" y="190" font-size="12" fill="#ffffff" text-anchor="middle">你</text><text x="555" y="212" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="592" y="168" width="58" height="52" rx="6" fill="#d9480f"/><text x="621" y="190" font-size="12" fill="#ffffff" text-anchor="middle">小周</text><text x="621" y="212" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="658" y="168" width="58" height="52" rx="6" fill="#d9480f"/><text x="687" y="190" font-size="12" fill="#ffffff" text-anchor="middle">小林</text><text x="687" y="212" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <text x="526" y="252" font-size="12" fill="#52606d">公司</text>
  <rect x="526" y="260" width="58" height="52" rx="6" fill="#2f9e44"/><text x="555" y="282" font-size="12" fill="#ffffff" text-anchor="middle">公司 A</text><text x="555" y="304" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="592" y="260" width="58" height="52" rx="6" fill="#2f9e44"/><text x="621" y="282" font-size="12" fill="#ffffff" text-anchor="middle">公司 B</text><text x="621" y="304" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="658" y="260" width="58" height="52" rx="6" fill="#2f9e44"/><text x="687" y="282" font-size="12" fill="#ffffff" text-anchor="middle">公司 C</text><text x="687" y="304" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <text x="24" y="366" font-size="13" fill="#1f2933">三种分法都是"稳定"的：没有一个学生和一家公司，互相更想要对方，而愿意一起脱离。</text>
  <text x="24" y="388" font-size="12" fill="#7b8794">谁来"求"（先提出），谁就拿到对自己最好的稳定分法。</text>
</svg>
