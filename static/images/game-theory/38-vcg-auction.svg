<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="420" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">VCG：每个人付的，是自己"挤掉"别人的那一份</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">两件相同的东西，每人最多要一件。三个人的估价：你 8，小周 6，小林 4。估价最高的两个人拿到</text>
  <line x1="110" y1="300" x2="670" y2="300" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="140" y="164.0" width="90" height="136.0" rx="3" fill="#2f9e44"/>
  <text x="185" y="156.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">估价 8</text>
  <text x="185" y="320" font-size="13" fill="#52606d" text-anchor="middle">你</text>
  <text x="185" y="340" font-size="13" fill="#2f9e44" text-anchor="middle" font-weight="600">拿到，付 4</text>
  <rect x="320" y="198.0" width="90" height="102.0" rx="3" fill="#2f9e44"/>
  <text x="365" y="190.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">估价 6</text>
  <text x="365" y="320" font-size="13" fill="#52606d" text-anchor="middle">小周</text>
  <text x="365" y="340" font-size="13" fill="#2f9e44" text-anchor="middle" font-weight="600">拿到，付 4</text>
  <rect x="500" y="232.0" width="90" height="68.0" rx="3" fill="#9aa5b1"/>
  <text x="545" y="224.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">估价 4</text>
  <text x="545" y="320" font-size="13" fill="#52606d" text-anchor="middle">小林</text>
  <text x="545" y="340" font-size="13" fill="#7b8794" text-anchor="middle">没拿到</text>
  <line x1="110" y1="232.0" x2="670" y2="232.0" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="598" y="256.0" font-size="12" fill="#d9480f" text-anchor="start">4 = 没拿到的人的估价</text>
  <text x="24" y="372" font-size="13" fill="#1f2933">你没来的话，小林会拿到一件，值 4；所以你拿到东西，就"挤掉"了价值 4，你付 4。小周同理，也付 4。</text>
  <text x="24" y="394" font-size="12" fill="#7b8794">这就是"落选者中最高的出价"定价。只有一件东西时，它就是第二价格拍卖。</text>
</svg>
