<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="430" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">赢者诅咒：竞拍的人越多，"赢的人高估了多少"越大</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">东西的真实价值是 100，每个人的估计 = 100 + 一个 −20 到 +20 之间的随机误差。柱子：估计最高的那个人，平均高估了多少</text>
  <line x1="110" y1="330" x2="670" y2="330" stroke="#9aa5b1" stroke-width="1.5"/>
  <g stroke="#e4e7eb">
    <line x1="110" y1="275.0" x2="670" y2="275.0"/>
    <line x1="110" y1="220.0" x2="670" y2="220.0"/>
    <line x1="110" y1="165.0" x2="670" y2="165.0"/>
    <line x1="110" y1="110.0" x2="670" y2="110.0"/>
  </g>
  <g font-size="12" fill="#52606d" text-anchor="end">
    <text x="102" y="334.0">0</text>
    <text x="102" y="279.0">5</text>
    <text x="102" y="224.0">10</text>
    <text x="102" y="169.0">15</text>
    <text x="102" y="114.0">20</text>
  </g>
  <rect x="150" y="256.6" width="80" height="73.4" rx="3" fill="#d9480f"/>
  <text x="190" y="248.6" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">6.67</text>
  <text x="190" y="350" font-size="13" fill="#52606d" text-anchor="middle">2 个人竞拍</text>
  <rect x="280" y="183.4" width="80" height="146.6" rx="3" fill="#d9480f"/>
  <text x="320" y="175.4" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">13.33</text>
  <text x="320" y="350" font-size="13" fill="#52606d" text-anchor="middle">5 个人竞拍</text>
  <rect x="410" y="150.0" width="80" height="180.0" rx="3" fill="#d9480f"/>
  <text x="450" y="142.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">16.36</text>
  <text x="450" y="350" font-size="13" fill="#52606d" text-anchor="middle">10 个人竞拍</text>
  <rect x="540" y="130.9" width="80" height="199.1" rx="3" fill="#d9480f"/>
  <text x="580" y="122.9" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">18.10</text>
  <text x="580" y="350" font-size="13" fill="#52606d" text-anchor="middle">20 个人竞拍</text>
  <text x="24" y="392" font-size="13" fill="#1f2933">如果每个人都直接按自己的估计出价，赢的人平均要多付这么多。公式：误差范围 × (人数 − 1) ÷ (人数 + 1)。</text>
  <text x="24" y="412" font-size="12" fill="#7b8794">人数越多，"最高的估计"越离谱，所以越要把出价压得低一些。</text>
</svg>
