<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="360" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">一张价值 100 的牌照：抽签和拍卖，这 100 最后去了哪里</text>
  <text x="24" y="50" font-size="12" fill="#7b8794">每人申请要花 0.05。抽签时人人都想碰运气，申请的人会一直多到"期望所得 = 申请成本"。数字是编的</text>
  <text x="140" y="92" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">抽签</text>
  <rect x="80" y="110" width="120" height="150" fill="#d9480f" opacity="0.9"/>
  <text x="140" y="190" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">2000 人的申请成本</text>
  <text x="140" y="210" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">合计 100，全浪费</text>
  <text x="140" y="282" font-size="12" fill="#52606d" text-anchor="middle">国库收入 0</text>
  <text x="400" y="92" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">拍卖</text>
  <rect x="340" y="110" width="120" height="150" fill="#2b8a3e" opacity="0.9"/>
  <text x="400" y="190" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">卖给出价最高者</text>
  <text x="400" y="210" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">国库收入约 100</text>
  <text x="400" y="282" font-size="12" fill="#52606d" text-anchor="middle">申请成本几乎没有</text>
  <text x="590" y="130" font-size="12" fill="#1f2933" font-weight="600">申请成本 c → 申请人数</text>
  <text x="590" y="156" font-size="12" fill="#52606d">c = 0.25 → 400 人</text>
  <text x="590" y="176" font-size="12" fill="#52606d">c = 0.10 → 1000 人</text>
  <text x="590" y="196" font-size="12" fill="#52606d">c = 0.05 → 2000 人</text>
  <text x="24" y="326" font-size="13" fill="#1f2933">申请越便宜，来的人越多，抽签浪费的就越多；总浪费始终等于牌照的价值 100。</text>
</svg>
