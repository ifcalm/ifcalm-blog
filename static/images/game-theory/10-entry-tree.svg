<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
  <rect width="760" height="340" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">进入博弈：那句"我会开战"的威胁，可信吗？</text>
  <g stroke="#52606d" stroke-width="2" fill="none">
    <line x1="260" y1="86" x2="140" y2="230"/>
    <line x1="260" y1="86" x2="420" y2="150"/>
    <line x1="420" y1="176" x2="330" y2="250"/>
    <line x1="420" y1="176" x2="540" y2="250"/>
  </g>
  <g stroke="#d9480f" stroke-width="4" fill="none">
    <line x1="260" y1="86" x2="420" y2="150"/>
    <line x1="420" y1="176" x2="540" y2="250" marker-end="url(#m)"/>
  </g>
  <circle cx="260" cy="72" r="14" fill="#e7f0fd" stroke="#4c78c9" stroke-width="2"/>
  <text x="260" y="76" font-size="12" fill="#1f2933" text-anchor="middle">你</text>
  <circle cx="420" cy="163" r="14" fill="#fff0e0" stroke="#f08c00" stroke-width="2"/>
  <text x="420" y="167" font-size="11" fill="#1f2933" text-anchor="middle">小周</text>
  <g font-size="13" fill="#1f2933" text-anchor="middle">
    <text x="176" y="140">不进入</text>
    <text x="360" y="102">进入</text>
    <text x="352" y="214">开战</text>
    <text x="518" y="214">接受</text>
  </g>
  <g font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">
    <text x="140" y="256">（0，4）</text>
    <text x="330" y="276">（−1，0）</text>
    <text x="540" y="276">（2，2）</text>
  </g>
  <text x="380" y="312" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="600">倒着想：你进入后，小周开战得 0、接受得 2，所以小周会接受</text>
  <text x="24" y="58" font-size="12" fill="#7b8794">括号里：（你的收益，小周的收益）</text>
</svg>
