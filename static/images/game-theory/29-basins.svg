<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="420" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">两个惯例都站得住，可是离开它们的难度差得很远</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">8 个人，每人选"冒险"（S，成了得 4）或"稳妥"（H，总得 3）。格子里的数：此刻有几个人选冒险</text>
  <rect x="60" y="110" width="66" height="56" rx="6" fill="#fde3cf" stroke="#9aa5b1"/>
  <text x="93.0" y="145" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">0</text>
  <rect x="130" y="110" width="66" height="56" rx="6" fill="#fde3cf" stroke="#9aa5b1"/>
  <text x="163.0" y="145" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">1</text>
  <rect x="200" y="110" width="66" height="56" rx="6" fill="#fde3cf" stroke="#9aa5b1"/>
  <text x="233.0" y="145" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">2</text>
  <rect x="270" y="110" width="66" height="56" rx="6" fill="#fde3cf" stroke="#9aa5b1"/>
  <text x="303.0" y="145" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">3</text>
  <rect x="340" y="110" width="66" height="56" rx="6" fill="#fde3cf" stroke="#9aa5b1"/>
  <text x="373.0" y="145" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">4</text>
  <rect x="410" y="110" width="66" height="56" rx="6" fill="#fde3cf" stroke="#9aa5b1"/>
  <text x="443.0" y="145" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">5</text>
  <rect x="480" y="110" width="66" height="56" rx="6" fill="#fde3cf" stroke="#9aa5b1"/>
  <text x="513.0" y="145" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">6</text>
  <rect x="550" y="110" width="66" height="56" rx="6" fill="#dbe7fb" stroke="#9aa5b1"/>
  <text x="583.0" y="145" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">7</text>
  <rect x="620" y="110" width="66" height="56" rx="6" fill="#dbe7fb" stroke="#9aa5b1"/>
  <text x="653.0" y="145" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">8</text>
  <text x="305.0" y="100" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="600">0–6 人冒险：大家各自的最佳选择都是"稳妥"，往全 H 滑</text>
  <text x="585.0" y="188" font-size="13" fill="#4c78c9" text-anchor="middle" font-weight="600">7–8 人冒险：往全 S 滑</text>
  <line x1="93.0" y1="230" x2="583.0" y2="230" stroke="#d9480f" stroke-width="2.5"/>
  <polygon points="583.0,230 574.0,224 574.0,236" fill="#d9480f"/>
  <text x="305.0" y="254" font-size="13" fill="#d9480f" text-anchor="middle">从"全稳妥"跨到冒险那边：要连续 7 个人同时手滑选冒险</text>
  <line x1="653.0" y1="290" x2="513.0" y2="290" stroke="#4c78c9" stroke-width="2.5"/>
  <polygon points="513.0,290 522.0,284 522.0,296" fill="#4c78c9"/>
  <text x="480" y="314" font-size="13" fill="#4c78c9" text-anchor="middle">从"全冒险"掉回来：只要 2 个人同时手滑选稳妥</text>
  <text x="24" y="364" font-size="13" fill="#1f2933">每人每步有 10% 的概率随机手滑时：离开"全冒险"每步约 5.7%；离开"全稳妥"每步约十亿分之六。</text>
  <text x="24" y="386" font-size="12" fill="#7b8794">结果：群体几乎总是待在"稳妥"这个惯例上，哪怕"冒险"的惯例对每个人都更好（4 比 3）。</text>
</svg>
