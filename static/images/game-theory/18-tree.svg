<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="390" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">求职信号博弈的博弈树</text>

  <!-- branches -->
  <g stroke="#52606d" stroke-width="2" fill="none">
    <line x1="380" y1="62" x2="190" y2="104"/>
    <line x1="380" y1="62" x2="570" y2="104"/>
    <line x1="190" y1="130" x2="110" y2="214"/>
    <line x1="190" y1="130" x2="270" y2="214"/>
    <line x1="570" y1="130" x2="490" y2="214"/>
    <line x1="570" y1="130" x2="650" y2="214"/>
  </g>

  <!-- nature -->
  <circle cx="380" cy="50" r="12" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="2"/>
  <text x="380" y="30" font-size="13" fill="#52606d" text-anchor="middle">自然抽签（企业看不到）</text>
  <text x="262" y="68" font-size="13" fill="#1f2933" text-anchor="middle">高能力 H：概率 0.3</text>
  <text x="498" y="68" font-size="13" fill="#1f2933" text-anchor="middle">低能力 L：概率 0.7</text>

  <!-- applicant nodes -->
  <circle cx="190" cy="117" r="13" fill="#e7f0fd" stroke="#4c78c9" stroke-width="2"/>
  <circle cx="570" cy="117" r="13" fill="#e7f0fd" stroke="#4c78c9" stroke-width="2"/>
  <text x="190" y="121" font-size="11" fill="#1f2933" text-anchor="middle">H</text>
  <text x="570" y="121" font-size="11" fill="#1f2933" text-anchor="middle">L</text>
  <text x="125" y="108" font-size="12" fill="#52606d" text-anchor="middle">应聘者选</text>

  <!-- branch labels -->
  <g font-size="13" fill="#1f2933" text-anchor="middle">
    <text x="136" y="170">读研</text>
    <text x="258" y="170">不读</text>
    <text x="498" y="170">不读</text>
    <text x="640" y="170">读研</text>
  </g>

  <!-- firm nodes -->
  <g fill="#fff0e0" stroke="#f08c00" stroke-width="2">
    <circle cx="110" cy="227" r="13"/>
    <circle cx="270" cy="227" r="13"/>
    <circle cx="490" cy="227" r="13"/>
    <circle cx="650" cy="227" r="13"/>
  </g>
  <g font-size="11" fill="#1f2933" text-anchor="middle">
    <text x="110" y="231">企业</text>
    <text x="270" y="231">企业</text>
    <text x="490" y="231">企业</text>
    <text x="650" y="231">企业</text>
  </g>

  <!-- information sets (dashed) -->
  <line x1="283" y1="227" x2="477" y2="227" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M110,240 Q380,350 650,240" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>

  <text x="380" y="254" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="600">信息集：只看到"没读研"，看不出是 H 还是 L</text>
  <text x="380" y="335" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="600">信息集：只看到"读研"，看不出是 H 还是 L</text>
  <text x="380" y="368" font-size="12" fill="#7b8794" text-anchor="middle">企业的工资，只能依据它在信息集里的"信念"来定</text>
</svg>
