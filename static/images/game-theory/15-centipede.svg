<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
  <rect width="760" height="360" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">蜈蚣博弈：每继续一步，总数翻倍，可是"拿走"总是诱人</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">括号里：（你的收益，小周的收益）</text>
  <line x1="126" y1="120" x2="244" y2="120" stroke="#52606d" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="185.0" y="108" font-size="12" fill="#52606d" text-anchor="middle">继续</text>
  <line x1="110" y1="136" x2="110" y2="220" stroke="#52606d" stroke-width="2"/>
  <text x="126" y="184" font-size="12" fill="#52606d">拿走</text>
  <circle cx="110" cy="120" r="17" fill="#e7f0fd" stroke="#4c78c9" stroke-width="2"/><text x="110" y="124" font-size="11" fill="#1f2933" text-anchor="middle">你</text>
  <text x="110" y="244" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">（4，1）</text>
  <line x1="276" y1="120" x2="394" y2="120" stroke="#52606d" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="335.0" y="108" font-size="12" fill="#52606d" text-anchor="middle">继续</text>
  <line x1="260" y1="136" x2="260" y2="220" stroke="#52606d" stroke-width="2"/>
  <text x="276" y="184" font-size="12" fill="#52606d">拿走</text>
  <circle cx="260" cy="120" r="17" fill="#fff0e0" stroke="#f08c00" stroke-width="2"/><text x="260" y="124" font-size="11" fill="#1f2933" text-anchor="middle">小周</text>
  <text x="260" y="244" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">（2，8）</text>
  <line x1="426" y1="120" x2="544" y2="120" stroke="#52606d" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="485.0" y="108" font-size="12" fill="#52606d" text-anchor="middle">继续</text>
  <line x1="410" y1="136" x2="410" y2="220" stroke="#52606d" stroke-width="2"/>
  <text x="426" y="184" font-size="12" fill="#52606d">拿走</text>
  <circle cx="410" cy="120" r="17" fill="#e7f0fd" stroke="#4c78c9" stroke-width="2"/><text x="410" y="124" font-size="11" fill="#1f2933" text-anchor="middle">你</text>
  <text x="410" y="244" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">（16，4）</text>
  <line x1="560" y1="136" x2="560" y2="220" stroke="#52606d" stroke-width="2"/>
  <text x="576" y="184" font-size="12" fill="#52606d">拿走</text>
  <circle cx="560" cy="120" r="17" fill="#fff0e0" stroke="#f08c00" stroke-width="2"/><text x="560" y="124" font-size="11" fill="#1f2933" text-anchor="middle">小周</text>
  <text x="560" y="244" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">（8，32）</text>
  <line x1="576" y1="120" x2="630" y2="120" stroke="#52606d" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="595" y="108" font-size="12" fill="#52606d" text-anchor="middle">继续</text>
  <text x="692" y="126" font-size="15" font-weight="600" fill="#2b8a3e" text-anchor="middle">（64，16）</text>
  <text x="24" y="300" font-size="13" fill="#d9480f" font-weight="600">倒着想：最后一步小周拿走（32 &gt; 16），所以你在第三步拿走（16 &gt; 8）…… 一路推下去，第一步你就该拿走，得 4。</text>
  <text x="24" y="324" font-size="13" fill="#1f2933">可是大家一路继续，你们本可以拿到（64，16）。</text>
</svg>
