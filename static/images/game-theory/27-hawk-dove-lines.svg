<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="470" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">鹰多了鹰吃亏，鸽多了鸽吃亏：稳定在 2/3</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">横轴：种群里鹰的比例 p；纵轴：一只鹰（橙）或一只鸽（蓝）的平均收益</text>
  <g stroke="#e4e7eb" stroke-width="1">
    <line x1="110" y1="358.3" x2="670" y2="358.3"/>
    <line x1="110" y1="315.0" x2="670" y2="315.0"/>
    <line x1="110" y1="271.7" x2="670" y2="271.7"/>
    <line x1="110" y1="228.3" x2="670" y2="228.3"/>
    <line x1="110" y1="185.0" x2="670" y2="185.0"/>
    <line x1="110" y1="141.7" x2="670" y2="141.7"/>
  </g>
  <line x1="110" y1="315.0" x2="670" y2="315.0" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="110" y1="120.0" x2="110" y2="380.0" stroke="#9aa5b1" stroke-width="1.5"/>
  <g font-size="12" fill="#52606d" text-anchor="end">
    <text x="102" y="362.3">-1</text>
    <text x="102" y="319.0">0</text>
    <text x="102" y="275.7">1</text>
    <text x="102" y="232.3">2</text>
    <text x="102" y="189.0">3</text>
    <text x="102" y="145.7">4</text>
  </g>
  <g font-size="12" fill="#52606d" text-anchor="middle">
    <text x="110.0" y="398.0">0</text>
    <text x="250.0" y="398.0">0.25</text>
    <text x="390.0" y="398.0">0.5</text>
    <text x="530.0" y="398.0">0.75</text>
    <text x="670.0" y="398.0">1</text>
  </g>
  <line x1="110.0" y1="141.7" x2="670.0" y2="358.3" stroke="#d9480f" stroke-width="3"/>
  <line x1="110.0" y1="228.3" x2="670.0" y2="315.0" stroke="#4c78c9" stroke-width="3"/>
  <circle cx="483.3" cy="286.1" r="7" fill="#1f2933"/>
  <text x="495.3" y="276.1" font-size="13" fill="#1f2933" font-weight="600">p = 2/3：两条线相交，收益都是 2/3</text>
  <text x="214.0" y="132.3" font-size="13" fill="#d9480f" font-weight="600">鹰：4 − 5p</text>
  <text x="124.0" y="247.8" font-size="13" fill="#4c78c9" font-weight="600">鸽：2 − 2p</text>
  <text x="24" y="440" font-size="12" fill="#7b8794">p 小于 2/3：鹰的收益更高，鹰会变多；p 大于 2/3：鸽的收益更高，鹰会变少。全是鸽时（p = 0）一只鹰能得 4，高于鸽的 2。</text>
</svg>
