  <text x="405.0" y="277.7" font-size="13" fill="#1f2933" font-weight="600">δ = 1/2：两者相等，价值 6</text>
  <text x="212.0" y="324.3" font-size="13" fill="#2f9e44">绿线：一直合作 = 3 ÷ (1 − δ)</text>
  <text x="120.5" y="245.4" font-size="13" fill="#d9480f">橙线：背叛一次 = 5 + δ × 1 ÷ (1 − δ)</text>
  <text x="24" y="440" font-size="13" fill="#1f2933">δ 小于 1/2：橙线在上，当下的 5 太诱人；δ 大于 1/2：绿线在上，合作更划算。</text>
  <text x="24" y="460" font-size="12" fill="#7b8794">合作：每轮 3；背叛得 5，此后对方永远背叛，每轮只有 1。</text>
