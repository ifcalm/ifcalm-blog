  <line x1="90" y1="300" x2="690" y2="300" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="150" y="162.5" width="100" height="137.5" rx="3" fill="#4c78c9"/>
  <text x="200" y="152.5" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">100</text>
  <text x="200" y="324" font-size="13" fill="#52606d" text-anchor="middle">只卖基础版 100</text>
  <rect x="330" y="148.8" width="100" height="151.2" rx="3" fill="#4c78c9"/>
  <text x="380" y="138.8" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">110</text>
  <text x="380" y="324" font-size="13" fill="#52606d" text-anchor="middle">只卖灵活版 220</text>
  <rect x="510" y="93.8" width="100" height="206.2" rx="3" fill="#d9480f"/>
  <text x="560" y="83.8" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">150</text>
  <text x="560" y="324" font-size="13" fill="#52606d" text-anchor="middle">两版并卖</text>
  <text x="24" y="360" font-size="12" fill="#7b8794">休闲旅客和商务旅客各占一半；两版并卖：基础版 100、灵活版 200</text>
</svg>
