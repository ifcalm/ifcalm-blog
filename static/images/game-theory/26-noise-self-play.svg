<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="440" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">一点点手滑，就能毁掉以牙还牙之间的合作</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">两个人都用同一个策略，每次行动有 1% 的概率"手滑"做成相反的动作；纵轴：长期平均每周收益</text>
  <line x1="100" y1="330" x2="700" y2="330" stroke="#9aa5b1" stroke-width="1.5"/>
  <g stroke="#e4e7eb" stroke-width="1">
    <line x1="100" y1="258.1" x2="700" y2="258.1"/>
    <line x1="100" y1="186.2" x2="700" y2="186.2"/>
    <line x1="100" y1="114.4" x2="700" y2="114.4"/>
  </g>
  <g font-size="12" fill="#52606d" text-anchor="end">
    <text x="92" y="334.0">0</text>
    <text x="92" y="262.1">1</text>
    <text x="92" y="190.2">2</text>
    <text x="92" y="118.4">3</text>
  </g>
  <rect x="125" y="168.3" width="70" height="161.7" rx="3" fill="#d9480f"/>
  <text x="160" y="160.3" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">2.25</text>
  <text x="160" y="350" font-size="12" fill="#52606d" text-anchor="middle">以牙还牙</text>
  <rect x="240" y="116.5" width="70" height="213.5" rx="3" fill="#2f9e44"/>
  <text x="275" y="108.5" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">2.97</text>
  <text x="275" y="350" font-size="12" fill="#52606d" text-anchor="middle">宽厚以牙还牙</text>
  <text x="275" y="366" font-size="12" fill="#52606d" text-anchor="middle">(宽恕概率 1/3)</text>
  <rect x="355" y="118.0" width="70" height="212.0" rx="3" fill="#2f9e44"/>
  <text x="390" y="110.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">2.95</text>
  <text x="390" y="350" font-size="12" fill="#52606d" text-anchor="middle">赢留输换</text>
  <rect x="470" y="115.1" width="70" height="214.9" rx="3" fill="#9aa5b1"/>
  <text x="505" y="107.1" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">2.99</text>
  <text x="505" y="350" font-size="12" fill="#52606d" text-anchor="middle">永远合作</text>
  <rect x="585" y="256.0" width="70" height="74.0" rx="3" fill="#9aa5b1"/>
  <text x="620" y="248.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">1.03</text>
  <text x="620" y="350" font-size="12" fill="#52606d" text-anchor="middle">永远背叛</text>
  <text x="24" y="400" font-size="12" fill="#7b8794">收益：互相合作 3，被占便宜 0，占便宜 5，互相背叛 1。以牙还牙的 2.25 是四种结果各占四分之一的平均。</text>
  <text x="24" y="420" font-size="12" fill="#7b8794">宽恕让合作"自己修好"；代价是遇到永远背叛的人时，会被多占一些便宜。</text>
</svg>
