<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="450" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">来回确认了很多封，你仍然觉得"对方更可能不敢进攻"</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">纵轴：你认为对方这时选"不进攻"的概率；虚线 1/3：低于这个数才敢进攻（丢失概率 1%，状态 b 的先验 10%）</text>
  <line x1="90" y1="310" x2="690" y2="310" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="110" y="89.9" width="62" height="220.1" rx="3" fill="#4c78c9"/>
  <text x="141" y="81.9" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">0.92</text>
  <text x="141" y="330" font-size="11" fill="#52606d" text-anchor="middle">收到 0 封</text>
  <text x="141" y="345" font-size="11" fill="#7b8794" text-anchor="middle">(之前什么也没有)</text>
  <rect x="208" y="189.4" width="62" height="120.6" rx="3" fill="#d9480f"/>
  <text x="239" y="181.4" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">0.50</text>
  <text x="239" y="330" font-size="11" fill="#52606d" text-anchor="middle">发 1 封</text>
  <text x="239" y="345" font-size="11" fill="#7b8794" text-anchor="middle">没收到回信</text>
  <rect x="306" y="189.4" width="62" height="120.6" rx="3" fill="#d9480f"/>
  <text x="337" y="181.4" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">0.50</text>
  <text x="337" y="330" font-size="11" fill="#52606d" text-anchor="middle">收到 1 封</text>
  <text x="337" y="345" font-size="11" fill="#7b8794" text-anchor="middle">回了 1 封</text>
  <rect x="404" y="189.4" width="62" height="120.6" rx="3" fill="#d9480f"/>
  <text x="435" y="181.4" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">0.50</text>
  <text x="435" y="330" font-size="11" fill="#52606d" text-anchor="middle">发 2 封</text>
  <text x="435" y="345" font-size="11" fill="#7b8794" text-anchor="middle">没收到回信</text>
  <rect x="502" y="189.4" width="62" height="120.6" rx="3" fill="#d9480f"/>
  <text x="533" y="181.4" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">0.50</text>
  <text x="533" y="330" font-size="11" fill="#52606d" text-anchor="middle">收到 2 封</text>
  <text x="533" y="345" font-size="11" fill="#7b8794" text-anchor="middle">回了 2 封</text>
  <rect x="600" y="189.4" width="62" height="120.6" rx="3" fill="#d9480f"/>
  <text x="631" y="181.4" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">0.50</text>
  <text x="631" y="330" font-size="11" fill="#52606d" text-anchor="middle">……</text>
  <text x="631" y="345" font-size="11" fill="#7b8794" text-anchor="middle">(一路类推)</text>
  <line x1="90" y1="230.0" x2="690" y2="230.0" stroke="#2f9e44" stroke-width="2" stroke-dasharray="6 5"/>
  <text paint-order="stroke" stroke="#ffffff" stroke-width="5" x="690" y="222.0" font-size="12" fill="#2f9e44" text-anchor="end">1/3：敢进攻的分界线</text>
  <text x="24" y="412" font-size="13" fill="#1f2933">每一步，对方保守的概率都超过一半，远高于 1/3。所以每个人都不进攻，一路到底。</text>
  <text x="24" y="432" font-size="12" fill="#7b8794">收益：状态 a 下双方都进攻各得 2，只有自己进攻亏 4；状态 b 下进攻总是更差。</text>
</svg>
