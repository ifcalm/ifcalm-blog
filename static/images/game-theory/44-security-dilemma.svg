<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="440" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">同样是军备，进攻占优和防守占优，是两个不同的博弈</text>
  <text x="180" y="76" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">进攻占优：囚徒困境</text>
  <text x="180" y="94" font-size="11" fill="#7b8794" text-anchor="middle">先动手的赢；数字是为说明而编</text>
  <text x="165" y="124" font-size="12" fill="#52606d" text-anchor="middle">乙国：不扩军</text><text x="275" y="124" font-size="12" fill="#52606d" text-anchor="middle">乙国：扩军</text>
  <text x="102" y="168" font-size="12" fill="#52606d" text-anchor="end">甲国：不扩军</text><text x="102" y="228" font-size="12" fill="#52606d" text-anchor="end">甲国：扩军</text>
  <rect x="110" y="134" width="110" height="60" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="165" y="170" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="600">10，10</text>
  <rect x="220" y="134" width="110" height="60" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="275" y="170" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="600">0，14</text>
  <rect x="110" y="194" width="110" height="60" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="165" y="230" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="600">14，0</text>
  <rect x="220" y="194" width="110" height="60" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="275" y="230" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="600">6，6</text>
  <text x="560" y="76" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">防守占优：猎鹿</text>
  <text x="560" y="94" font-size="11" fill="#7b8794" text-anchor="middle">单方扩军捞不到好处；数字是为说明而编</text>
  <text x="545" y="124" font-size="12" fill="#52606d" text-anchor="middle">乙国：不扩军</text><text x="655" y="124" font-size="12" fill="#52606d" text-anchor="middle">乙国：扩军</text>
  <text x="482" y="168" font-size="12" fill="#52606d" text-anchor="end">甲国：不扩军</text><text x="482" y="228" font-size="12" fill="#52606d" text-anchor="end">甲国：扩军</text>
  <rect x="490" y="134" width="110" height="60" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="545" y="170" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="600">10，10</text>
  <rect x="600" y="134" width="110" height="60" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="655" y="170" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="600">2，9</text>
  <rect x="490" y="194" width="110" height="60" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1"/><text x="545" y="230" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="600">9，2</text>
  <rect x="600" y="194" width="110" height="60" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="655" y="230" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="600">7，7</text>
  <text x="24" y="300" font-size="13" fill="#1f2933">左：扩军是占优策略，唯一的均衡是两国都扩军（6，6），比都不扩军（10，10）差。</text>
  <text x="24" y="324" font-size="13" fill="#1f2933">右：有两个均衡。如果你认为对方扩军的可能性超过 1/6，扩军就比不扩军好。</text>
  <text x="24" y="348" font-size="12" fill="#7b8794">格子里是（甲国，乙国）的收益。橙色框：均衡。</text>
</svg>
