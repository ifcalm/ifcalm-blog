<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="310" rx="10" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933">取石子：每次取 1 到 3 颗，取走最后一颗的赢</text>
  <text x="24" y="52" font-size="12" fill="#7b8794">格子里的数字：轮到你时，桌上还剩几颗。红色是"谁轮到谁输"（对手不犯错的话），绿色是"轮到你就能赢"</text>
  <rect x="60" y="100" width="36" height="46" rx="5" fill="#fde8e8" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="78" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">0</text>
  <text x="78" y="170" font-size="12" fill="#c92a2a" text-anchor="middle">输</text>
  <rect x="101" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="119" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">1</text>
  <text x="119" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 1</text>
  <rect x="142" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="160" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">2</text>
  <text x="160" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 2</text>
  <rect x="183" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="201" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">3</text>
  <text x="201" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 3</text>
  <rect x="224" y="100" width="36" height="46" rx="5" fill="#fde8e8" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="242" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">4</text>
  <text x="242" y="170" font-size="12" fill="#c92a2a" text-anchor="middle">输</text>
  <rect x="265" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="283" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">5</text>
  <text x="283" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 1</text>
  <rect x="306" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="324" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">6</text>
  <text x="324" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 2</text>
  <rect x="347" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="365" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">7</text>
  <text x="365" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 3</text>
  <rect x="388" y="100" width="36" height="46" rx="5" fill="#fde8e8" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="406" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">8</text>
  <text x="406" y="170" font-size="12" fill="#c92a2a" text-anchor="middle">输</text>
  <rect x="429" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="447" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">9</text>
  <text x="447" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 1</text>
  <rect x="470" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="488" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">10</text>
  <text x="488" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 2</text>
  <rect x="511" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="529" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">11</text>
  <text x="529" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 3</text>
  <rect x="552" y="100" width="36" height="46" rx="5" fill="#fde8e8" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="570" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">12</text>
  <text x="570" y="170" font-size="12" fill="#c92a2a" text-anchor="middle">输</text>
  <rect x="593" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="611" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">13</text>
  <text x="611" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 1</text>
  <rect x="634" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="652" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">14</text>
  <text x="652" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 2</text>
  <rect x="675" y="100" width="36" height="46" rx="5" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="3"/>
  <text x="693" y="130" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">15</text>
  <text x="693" y="170" font-size="12" fill="#2b8a3e" text-anchor="middle">取 3</text>
  <text x="24" y="215" font-size="13" fill="#1f2933" font-weight="600">倒着想：</text>
  <text x="24" y="238" font-size="13" fill="#1f2933">剩 0 颗：对手已经取走了最后一颗，你输。剩 1、2、3 颗：你一次取光，赢。</text>
  <text x="24" y="260" font-size="13" fill="#1f2933">剩 4 颗：不管你取几颗，对手都能取光，你输。剩 5、6、7 颗：你把 4 留给对手，你赢。</text>
  <text x="24" y="282" font-size="13" fill="#1f2933">同理，4 的倍数都是"谁轮到谁输"。所以剩 15 颗时，你取 3 颗，把 12 颗留给对手。</text>
</svg>
