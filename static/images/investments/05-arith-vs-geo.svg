<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="370" rx="12" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">算术平均都是每年 7.5%，10 年后却差了 4,000 多美元</text>

  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="80" y1="50" x2="600" y2="50"/>
    <line x1="80" y1="100" x2="600" y2="100"/>
    <line x1="80" y1="150" x2="600" y2="150"/>
    <line x1="80" y1="200" x2="600" y2="200"/>
    <line x1="80" y1="250" x2="600" y2="250"/>
  </g>
  <line x1="80" y1="300" x2="600" y2="300" stroke="#888" stroke-width="1.2"/>
  <line x1="80" y1="50" x2="80" y2="300" stroke="#888" stroke-width="1.2"/>

  <g font-size="12" fill="#666" text-anchor="end">
    <text x="72" y="54">25,000</text>
    <text x="72" y="104">20,000</text>
    <text x="72" y="154">15,000</text>
    <text x="72" y="204">10,000</text>
    <text x="72" y="254">5,000</text>
    <text x="72" y="304">0</text>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="80" y="320">0</text>
    <text x="184" y="320">2</text>
    <text x="288" y="320">4</text>
    <text x="392" y="320">6</text>
    <text x="496" y="320">8</text>
    <text x="600" y="320">10 年</text>
  </g>

  <polyline fill="none" stroke="#4a7fb5" stroke-width="2.5" points="80,200 132,192.5 184,184.4 236,175.8 288,166.5 340,156.4 392,145.7 444,134.1 496,121.7 548,108.3 600,93.9"/>
  <polyline fill="none" stroke="#e08a3c" stroke-width="2.5" points="80,200 132,170 184,189.5 236,156.4 288,177.9 340,141.3 392,165.1 444,124.6 496,150.9 548,106.2 600,135.3"/>

  <g font-size="12">
    <text x="606" y="98" fill="#4a7fb5">20,610</text>
    <text x="606" y="139" fill="#e08a3c">16,474</text>
  </g>

  <g font-size="12" fill="#333">
    <rect x="110" y="338" width="18" height="4" fill="#4a7fb5"/>
    <text x="134" y="344">甲：每年稳定 +7.5%（几何平均 7.5%）</text>
    <rect x="380" y="338" width="18" height="4" fill="#e08a3c"/>
    <text x="404" y="344">乙：+30%、−15% 交替（几何平均约 5.1%）</text>
  </g>
