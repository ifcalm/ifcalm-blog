<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="0" y="0" width="680" height="330" rx="12" fill="#ffffff"/>
<text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">1,000 次模拟：不同做法在真实世界里的平均夏普比率</text>
<line x1="250" y1="44" x2="250" y2="280" stroke="#f0f0f0"/><text x="250" y="296" font-size="11" fill="#666" text-anchor="middle">0.0</text>
<line x1="362.0" y1="44" x2="362.0" y2="280" stroke="#f0f0f0"/><text x="362.0" y="296" font-size="11" fill="#666" text-anchor="middle">0.2</text>
<line x1="474.0" y1="44" x2="474.0" y2="280" stroke="#f0f0f0"/><text x="474.0" y="296" font-size="11" fill="#666" text-anchor="middle">0.4</text>
<line x1="586.0" y1="44" x2="586.0" y2="280" stroke="#f0f0f0"/><text x="586.0" y="296" font-size="11" fill="#666" text-anchor="middle">0.6</text>
<text x="240" y="69" font-size="12" fill="#333" text-anchor="end">优化器以为自己能拿到的</text>
<rect x="250" y="52" width="359.0" height="24" rx="3" fill="#cfcfcf"/>
<text x="615.0" y="69" font-size="12" fill="#333">0.641</text>
<text x="240" y="107" font-size="12" fill="#333" text-anchor="end">知道真实参数时的最优组合</text>
<rect x="250" y="90" width="215.6" height="24" rx="3" fill="#6aa36a"/>
<text x="471.6" y="107" font-size="12" fill="#333">0.385</text>
<text x="240" y="145" font-size="12" fill="#333" text-anchor="end">三只基金各 1/3</text>
<rect x="250" y="128" width="200.5" height="24" rx="3" fill="#4a7fb5"/>
<text x="456.5" y="145" font-size="12" fill="#333">0.358</text>
<text x="240" y="183" font-size="12" fill="#333" text-anchor="end">优化，但单只最多 50%</text>
<rect x="250" y="166" width="199.4" height="24" rx="3" fill="#4a7fb5"/>
<text x="455.4" y="183" font-size="12" fill="#333">0.356</text>
<text x="240" y="221" font-size="12" fill="#333" text-anchor="end">优化，期望收益向常识收缩</text>
<rect x="250" y="204" width="196.0" height="24" rx="3" fill="#4a7fb5"/>
<text x="452.0" y="221" font-size="12" fill="#333">0.350</text>
<text x="240" y="259" font-size="12" fill="#333" text-anchor="end">直接按十年数据优化</text>
<rect x="250" y="242" width="180.3" height="24" rx="3" fill="#e08a3c"/>
<text x="436.3" y="259" font-size="12" fill="#333">0.322</text>
<text x="340" y="318" text-anchor="middle" font-size="11" fill="#888">灰色是样本内的估计值；其余是按真实参数算的夏普比率。"各 1/3"和真实最优是固定比例，不随模拟变化</text>
</svg>