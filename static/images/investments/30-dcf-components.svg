<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="0" y="0" width="680" height="340" rx="12" fill="#ffffff"/>
<text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">阿杰咖啡的企业价值约 2,399 万美元：八成来自第 5 年以后</text>
<rect x="70" y="281.8" width="70" height="8.2" fill="#4a7fb5"/>
<text x="105" y="275.8" font-size="12" fill="#333" text-anchor="middle">712</text>
<text x="105" y="308" font-size="11" fill="#555" text-anchor="middle">第 1 年</text>
<rect x="165" y="280.2" width="70" height="9.8" fill="#4a7fb5"/>
<text x="200" y="274.2" font-size="12" fill="#333" text-anchor="middle">848</text>
<text x="200" y="308" font-size="11" fill="#555" text-anchor="middle">第 2 年</text>
<rect x="260" y="278.9" width="70" height="11.1" fill="#4a7fb5"/>
<text x="295" y="272.9" font-size="12" fill="#333" text-anchor="middle">969</text>
<text x="295" y="308" font-size="11" fill="#555" text-anchor="middle">第 3 年</text>
<rect x="355" y="277.7" width="70" height="12.3" fill="#4a7fb5"/>
<text x="390" y="271.7" font-size="12" fill="#333" text-anchor="middle">1,071</text>
<text x="390" y="308" font-size="11" fill="#555" text-anchor="middle">第 4 年</text>
<rect x="450" y="276.8" width="70" height="13.2" fill="#4a7fb5"/>
<text x="485" y="270.8" font-size="12" fill="#333" text-anchor="middle">1,148</text>
<text x="485" y="308" font-size="11" fill="#555" text-anchor="middle">第 5 年</text>
<rect x="545" y="68.7" width="70" height="221.3" fill="#e08a3c"/>
<text x="580" y="62.7" font-size="12" fill="#333" text-anchor="middle">19,240</text>
<text x="580" y="308" font-size="11" fill="#555" text-anchor="middle">第 5 年以后（终值）</text>
<line x1="60" y1="290" x2="640" y2="290" stroke="#888"/>
<text x="340" y="330" text-anchor="middle" font-size="11" fill="#888">每一根柱子是那一部分自由现金流折算到今天的价值（千美元），折现率 9.5%，终值按 3% 永续增长</text>
</svg>