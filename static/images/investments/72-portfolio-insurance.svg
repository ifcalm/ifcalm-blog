<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="0" y="0" width="680" height="350" rx="12" fill="#ffffff"/>
<text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">组合保险：市场每跌一次，就要再卖出一大块股票</text>
<line x1="80" y1="290.0" x2="620" y2="290.0" stroke="#888"/><text x="72" y="294.0" font-size="11" fill="#666" text-anchor="end">0</text>
<line x1="80" y1="225.0" x2="620" y2="225.0" stroke="#f0f0f0"/><text x="72" y="229.0" font-size="11" fill="#666" text-anchor="end">25</text>
<line x1="80" y1="160.0" x2="620" y2="160.0" stroke="#f0f0f0"/><text x="72" y="164.0" font-size="11" fill="#666" text-anchor="end">50</text>
<line x1="80" y1="95.0" x2="620" y2="95.0" stroke="#f0f0f0"/><text x="72" y="99.0" font-size="11" fill="#666" text-anchor="end">75</text>
<rect x="110" y="95.0" width="56" height="195.0" fill="#4a7fb5"/>
<text x="138" y="111.0" font-size="11" fill="#fff" text-anchor="middle">75.0</text>
<text x="138" y="308" font-size="11" fill="#444" text-anchor="middle">开始</text>
<text x="138" y="324" font-size="10" fill="#888" text-anchor="middle">市场累计 0%，组合 100.0</text>
<rect x="215" y="143.8" width="56" height="146.2" fill="#4a7fb5"/>
<rect x="215" y="104.8" width="56" height="39.0" fill="#e9a96b"/><text x="243" y="98.8" font-size="11" fill="#a05a1c" text-anchor="middle">卖出 15.0</text>
<text x="243" y="159.8" font-size="11" fill="#fff" text-anchor="middle">56.2</text>
<text x="243" y="308" font-size="11" fill="#444" text-anchor="middle">第 1 次下跌后</text>
<text x="243" y="324" font-size="10" fill="#888" text-anchor="middle">市场累计 −5%，组合 96.2</text>
<rect x="320" y="180.3" width="56" height="109.7" fill="#4a7fb5"/>
<rect x="320" y="151.1" width="56" height="29.2" fill="#e9a96b"/><text x="348" y="145.1" font-size="11" fill="#a05a1c" text-anchor="middle">卖出 11.2</text>
<text x="348" y="196.3" font-size="11" fill="#fff" text-anchor="middle">42.2</text>
<text x="348" y="308" font-size="11" fill="#444" text-anchor="middle">第 2 次</text>
<text x="348" y="324" font-size="10" fill="#888" text-anchor="middle">市场累计 −9.8%，组合 93.4</text>
<rect x="425" y="207.7" width="56" height="82.3" fill="#4a7fb5"/>
<rect x="425" y="185.8" width="56" height="21.9" fill="#e9a96b"/><text x="453" y="179.8" font-size="11" fill="#a05a1c" text-anchor="middle">卖出 8.4</text>
<text x="453" y="223.7" font-size="11" fill="#fff" text-anchor="middle">31.6</text>
<text x="453" y="308" font-size="11" fill="#444" text-anchor="middle">第 3 次</text>
<text x="453" y="324" font-size="10" fill="#888" text-anchor="middle">市场累计 −14.3%，组合 91.3</text>
<rect x="530" y="228.3" width="56" height="61.7" fill="#4a7fb5"/>
<rect x="530" y="211.8" width="56" height="16.5" fill="#e9a96b"/><text x="558" y="205.8" font-size="11" fill="#a05a1c" text-anchor="middle">卖出 6.3</text>
<text x="558" y="244.3" font-size="11" fill="#fff" text-anchor="middle">23.7</text>
<text x="558" y="308" font-size="11" fill="#444" text-anchor="middle">第 4 次</text>
<text x="558" y="324" font-size="10" fill="#888" text-anchor="middle">市场累计 −18.5%，组合 89.8</text>
<text x="340" y="344" text-anchor="middle" font-size="10" fill="#999">假设：组合 100、保底 85、乘数 5（持有股票 = 5 ×（组合价值 − 85）），每次市场下跌 5% 后调整</text>
</svg>