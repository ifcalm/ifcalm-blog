<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="0" y="0" width="680" height="360" rx="12" fill="#ffffff"/>
<text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">同样的因子敏感度，不同的期望收益：这就是套利机会</text>
<line x1="110" y1="260" x2="604.0" y2="260" stroke="#f0f0f0"/><text x="102" y="264" font-size="12" fill="#666" text-anchor="end">2%</text>
<line x1="110" y1="220" x2="604.0" y2="220" stroke="#f0f0f0"/><text x="102" y="224" font-size="12" fill="#666" text-anchor="end">4%</text>
<line x1="110" y1="180" x2="604.0" y2="180" stroke="#f0f0f0"/><text x="102" y="184" font-size="12" fill="#666" text-anchor="end">6%</text>
<line x1="110" y1="140" x2="604.0" y2="140" stroke="#f0f0f0"/><text x="102" y="144" font-size="12" fill="#666" text-anchor="end">8%</text>
<line x1="110" y1="100" x2="604.0" y2="100" stroke="#f0f0f0"/><text x="102" y="104" font-size="12" fill="#666" text-anchor="end">10%</text>
<line x1="110" y1="60" x2="604.0" y2="60" stroke="#f0f0f0"/><text x="102" y="64" font-size="12" fill="#666" text-anchor="end">12%</text>
<text x="110.0" y="318" font-size="12" fill="#666" text-anchor="middle">0</text>
<text x="205.0" y="318" font-size="12" fill="#666" text-anchor="middle">0.25</text>
<text x="300.0" y="318" font-size="12" fill="#666" text-anchor="middle">0.5</text>
<text x="395.0" y="318" font-size="12" fill="#666" text-anchor="middle">0.75</text>
<text x="490.0" y="318" font-size="12" fill="#666" text-anchor="middle">1</text>
<text x="585.0" y="318" font-size="12" fill="#666" text-anchor="middle">1.25</text>
<line x1="110" y1="300" x2="604.0" y2="300" stroke="#888"/><line x1="110" y1="40" x2="110" y2="300" stroke="#888"/>
<text x="604.0" y="336" font-size="12" fill="#666" text-anchor="end">对因子的敏感度（因子贝塔）</text>
<text x="34" y="170" font-size="12" fill="#666" transform="rotate(-90 34 170)" text-anchor="middle">期望收益率</text>
<line x1="110" y1="220" x2="604.0" y2="64.0" stroke="#e08a3c" stroke-width="2.5"/>
<circle cx="110.0" cy="220.0" r="5" fill="#333"/><text x="120.0" y="236.0" font-size="12" fill="#333" text-anchor="start">国库券 4%</text>
<circle cx="490.0" cy="100.0" r="5" fill="#333"/><text x="480.0" y="88.0" font-size="12" fill="#333" text-anchor="end">充分分散的组合 A：β = 1，10%</text>
<circle cx="300.0" cy="160.0" r="5" fill="#4a7fb5"/><text x="310.0" y="182.0" font-size="12" fill="#4a7fb5" text-anchor="start">"混装箱"：50% A + 50% 国库券，β = 0.5，7%</text>
<circle cx="300.0" cy="140.0" r="5" fill="#b04a4a"/><text x="290.0" y="130.0" font-size="12" fill="#b04a4a" text-anchor="end">组合 C：β = 0.5，8%</text>
<line x1="300.0" y1="145" x2="300.0" y2="155" stroke="#b04a4a" stroke-width="1.6"/>
<text x="310.0" y="202.0" font-size="11" fill="#b04a4a">买 C、卖混装箱：每年无风险多赚 1%</text>
<text x="585.0" y="60.0" font-size="12" fill="#e08a3c" text-anchor="end">无套利定价线：4% + β × 6%</text>
</svg>