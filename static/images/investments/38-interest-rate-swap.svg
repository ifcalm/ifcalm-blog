<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="300" rx="12" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">利率互换：把一笔浮动利率贷款"换成"固定利率</text>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a7fb5"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08a3c"/></marker>
  </defs>
  <rect x="40" y="110" width="150" height="70" rx="10" fill="#eef3f9" stroke="#9bb7d4"/>
  <text x="115" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5d8a">放贷的银行</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#555">1,000 万美元贷款</text>

  <rect x="265" y="110" width="150" height="70" rx="10" fill="#f9f0e7" stroke="#e9a96b"/>
  <text x="340" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#a05a1c">阿杰咖啡</text>
  <text x="340" y="160" text-anchor="middle" font-size="11" fill="#555">想要固定的利息</text>

  <rect x="490" y="110" width="150" height="70" rx="10" fill="#eef6ee" stroke="#9ccc9c"/>
  <text x="565" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#3f7f3f">互换交易商</text>
  <text x="565" y="160" text-anchor="middle" font-size="11" fill="#555">通常是大银行</text>

  <line x1="265" y1="128" x2="194" y2="128" stroke="#4a7fb5" stroke-width="2" marker-end="url(#ar)"/>
  <text x="228" y="118" text-anchor="middle" font-size="11" fill="#4a7fb5">付 SOFR + 1%</text>

  <line x1="415" y1="128" x2="486" y2="128" stroke="#e08a3c" stroke-width="2" marker-end="url(#ao)"/>
  <text x="452" y="118" text-anchor="middle" font-size="11" fill="#e08a3c">付固定 4%</text>

  <line x1="490" y1="164" x2="419" y2="164" stroke="#4a7fb5" stroke-width="2" marker-end="url(#ar)"/>
  <text x="452" y="186" text-anchor="middle" font-size="11" fill="#4a7fb5">收 SOFR</text>

  <text x="340" y="232" text-anchor="middle" font-size="12" fill="#333">阿杰咖啡的净利息：(SOFR + 1%) + 4% − SOFR = <tspan font-weight="600">固定 5%</tspan></text>
  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#777">SOFR 怎么变，两边的 SOFR 正好抵消；双方只交换利息差额，本金（名义本金）不交换</text>
</svg>
