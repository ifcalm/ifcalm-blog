<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="660" height="360" rx="12" fill="#ffffff"/>
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#222">同样投 10,000 美元：借钱给咖啡馆 vs 入股咖啡馆</text>
  <!-- grid -->
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="70" y1="70" x2="630" y2="70"/>
    <line x1="70" y1="130" x2="630" y2="130"/>
    <line x1="70" y1="250" x2="630" y2="250"/>
  </g>
  <line x1="70" y1="190" x2="630" y2="190" stroke="#888" stroke-width="1.5"/>
  <g font-size="12" fill="#666" text-anchor="end">
    <text x="62" y="74">20%</text>
    <text x="62" y="134">10%</text>
    <text x="62" y="194">0%</text>
    <text x="62" y="254">-10%</text>
  </g>
  <!-- lender bars (6%) -->
  <g fill="#4a7fb5">
    <rect x="100" y="154" width="40" height="36"/>
    <rect x="235" y="154" width="40" height="36"/>
    <rect x="370" y="154" width="40" height="36"/>
    <rect x="505" y="154" width="40" height="36"/>
  </g>
  <!-- owner bars -->
  <g fill="#e08a3c">
    <rect x="150" y="190" width="40" height="74"/>
    <rect x="285" y="184" width="40" height="6"/>
    <rect x="420" y="124" width="40" height="66"/>
    <rect x="555" y="64" width="40" height="126"/>
  </g>
  <!-- values -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="148">6%</text>
    <text x="255" y="148">6%</text>
    <text x="390" y="148">6%</text>
    <text x="525" y="148">6%</text>
    <text x="170" y="280">-12.3%</text>
    <text x="305" y="178">1%</text>
    <text x="440" y="118">11%</text>
    <text x="575" y="58">21%</text>
  </g>
  <!-- scenario labels -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="145" y="306">很差的一年</text>
    <text x="280" y="306">差的一年</text>
    <text x="415" y="306">一般的一年</text>
    <text x="550" y="306">好的一年</text>
  </g>
  <g font-size="11" fill="#777" text-anchor="middle">
    <text x="145" y="322">经营利润 -5,000</text>
    <text x="280" y="322">经营利润 3,000</text>
    <text x="415" y="322">经营利润 9,000</text>
    <text x="550" y="322">经营利润 15,000</text>
  </g>
  <!-- legend -->
  <rect x="210" y="336" width="14" height="12" fill="#4a7fb5"/>
  <text x="230" y="347" font-size="12" fill="#333">借钱给它（债权）</text>
  <rect x="370" y="336" width="14" height="12" fill="#e08a3c"/>
  <text x="390" y="347" font-size="12" fill="#333">入股（股权）</text>
</svg>
